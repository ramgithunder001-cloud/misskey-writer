<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    
    <!-- PWA & Address Bar Display Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FBFCFD">
    <meta name="apple-mobile-web-app-title" content="MW">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <title>MW</title>

    <!-- 외부 서버 미리 연결 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <!-- Galmuri pixel font (화면을 막지 않고 불러옴) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css"></noscript>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                        serif: ['Georgia', 'Cambria', 'Times New Roman', 'serif']
                    },
                    colors: {
                        neutral: {
                            50: '#F7F8FA', 100: '#EDEFF3', 200: '#DADDE4', 300: '#CBCED7', 400: '#868A99',
                            500: '#6F7382', 600: '#555968', 700: '#424652', 800: '#2C2F39', 900: '#1B1D25', 950: '#12131A'
                        },
                        paper: {
                            base: '#E6E8ED',
                            card: '#F0F2F5',
                            bright: '#F7F8FA',
                            line: '#D8DBE2',
                            border: '#CBCED7',
                            ink: '#22252E',
                            sub: '#555968',
                            muted: '#7F8392',
                            stamp: '#8C3A32'
                        }
                    }
                }
            }
        }
    </script>


    <style>
        :root {
            --app-font-size: 14px;
            --fs-scale: 1;   /* 글자 크기 배율 (선택값 / 14px) */
            --paper-bg: #E6E8ED;
            --paper-card-bg: #F0F2F5;
            --paper-line-color: #D8DBE2;
            --paper-border-color: #CBCED7;
            --ink-text: #22252E;
            --grain-texture: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.2  0 0 0 0 0.22  0 0 0 0 0.3  0 0 0 0.05 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url%28%23n%29'/%3E%3C/svg%3E");
            --grid-line-pattern: linear-gradient(to bottom, transparent 95%, rgba(150, 154, 168, 0.16) 95%);
        }

        html, body {
            background-color: var(--paper-bg);
            background-image: var(--grain-texture);
            color: var(--ink-text);
            font-family: 'Pretendard Variable', Pretendard, sans-serif;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow: hidden;
        }
        html { font-size: 14px; }
        body { font-size: calc(14px * var(--fs-scale)); }

        /* 글자 크기 설정: 여백·아이콘은 그대로 두고 글자만 일괄 배율 적용 */
        .text-xs { font-size: calc(0.75rem * var(--fs-scale)) !important; line-height: calc(1rem * var(--fs-scale)) !important; }
        .text-sm { font-size: calc(0.875rem * var(--fs-scale)) !important; line-height: calc(1.25rem * var(--fs-scale)) !important; }
        .text-\[11px\] { font-size: calc(11px * var(--fs-scale)) !important; }
        .text-\[10px\] { font-size: max(9px, calc(10px * var(--fs-scale))) !important; }

        /* Custom Paper Minimal Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #C3C6CF;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9195A3;
        }

        /* Mobile Viewport Fix */
        body {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
            font-size: max(16px, calc(14px * var(--fs-scale)));
        }

        /* Header & Panel Transparency for Layered Paper Feel */
        body > header {
            background-color: rgba(230, 232, 237, 0.95) !important;
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--paper-border-color);
            box-shadow: 0 1px 4px rgba(34, 37, 46, 0.04);
        }

        /* Paper Note Cards */
        .mention-card {
            background-color: var(--paper-card-bg);
            background-image: var(--grain-texture);
            border: 1px solid var(--paper-border-color);
            border-radius: 8px;
            box-shadow: none;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .mention-card:hover {
            border-color: #9EA1AE;
            transform: translateY(-1px);
            box-shadow: none;
            background-color: #F4F5F8;
        }

        .mention-card.selected-card {
            border-color: #22252E;
            box-shadow: 0 0 0 1.5px #22252E;
            background-color: #F7F8FA;
        }

        /* Subtle Corner fold visual indicator for selected note */
        .mention-card.selected-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 14px 14px 0;
            border-color: transparent #22252E transparent transparent;
            border-bottom-left-radius: 2px;
        }

        /* Text Clamping */
        .preview-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ruled Lines background effect for notebook area */
        .notebook-ruled {
            background-image: var(--grain-texture), var(--grid-line-pattern);
            background-size: auto, 100% 24px;
            line-height: 24px;
        }

        /* Thread Note Cards */
        .thread-note {
            background-color: #F0F2F5;
            background-image: var(--grain-texture);
            border: 1px solid var(--paper-border-color);
            box-shadow: none;
            border-radius: 8px;
        }

        .thread-note-current {
            border-color: #22252E;
            background-color: #F7F8FA;
            box-shadow: 0 0 0 1px #22252E;
        }

        /* Quote (renote) block */
        .quote-block {
            border: 1px solid var(--paper-border-color);
            border-left: 3px solid #9195A3;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.35);
            padding: 6px 9px;
            margin-top: 2px;
            margin-bottom: 8px;
        }
        .quote-block .quote-text { font-size: calc(12px * var(--fs-scale)); line-height: 1.55; color: #30333D; }
        .quote-missing { font-size: calc(11px * var(--fs-scale)); color: #6F7382; border-style: dashed; border-left-style: dashed; }

        /* Ink & Text Typography Hierarchy */
        .card-name { font-size: calc(13px * var(--fs-scale)); font-weight: 600; color: #22252E; }
        .card-handle { font-size: calc(11px * var(--fs-scale)); font-weight: 400; color: #6F7382; }
        .card-body { font-size: calc(13px * var(--fs-scale)); line-height: 1.6; font-weight: 400; color: #1B1D25; }
        .mention-tag { color: #7A7E8D; font-weight: 500; }

        /* Stamp Badge Style */
        .stamp-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1px 7px;
            font-size: max(9px, calc(10px * var(--fs-scale)));
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #8C3A32;
            border: 1.5px dashed #8C3A32;
            border-radius: 4px;
            transform: rotate(-2deg);
            opacity: 0.9;
            background-color: rgba(140, 58, 50, 0.04);
        }

        /* Reply check: 간결한 V자 (누르면 초록색) */
        .reply-check {
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--ink-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
        }
        .reply-check svg { width: 16px; height: 16px; }
        .reply-check:hover { opacity: 0.65; }
        .reply-check:active { transform: scale(0.88); }
        .reply-check.checked { color: #1FA35C; }

        /* Tactile Paper Button Effects */
        .btn-paper {
            background-color: #F0F2F5;
            border: 1px solid var(--paper-border-color);
            color: var(--ink-text);
            box-shadow: 0 1px 2px rgba(34, 37, 46, 0.06);
            transition: all 0.15s ease;
        }
        .btn-paper:hover {
            background-color: #F7F8FA;
            border-color: #9EA1AE;
            box-shadow: 0 2px 4px rgba(34, 37, 46, 0.09);
        }
        .btn-paper-dark {
            background-color: #22252E;
            border: 1px solid #22252E;
            color: #F0F2F5;
            box-shadow: 0 2px 4px rgba(34, 37, 46, 0.15);
            transition: all 0.15s ease;
        }
        .btn-paper-dark:hover {
            background-color: #30333D;
            box-shadow: 0 3px 6px rgba(34, 37, 46, 0.22);
        }

        /* 모바일: 스크롤 래퍼는 레이아웃에 영향 없음 (기존처럼 타래 + 하단 고정 작성창) */
        #threadScrollArea { display: contents; }

        /* PC: 타래와 작성창을 한 스크롤 영역에 두고, 작성창을 노트 바로 아래에 붙임 */
        @media (min-width: 768px) {
            #threadScrollArea {
                display: block;
                flex: 1 1 0%;
                min-height: 0;
                overflow-y: auto;
                padding: 16px;
                background-image: var(--grain-texture), var(--grid-line-pattern);
                background-size: auto, 100% 24px;
            }
            #threadVisualizerContainer {
                flex: none !important;
                overflow: visible !important;
                padding: 0 !important;
                background-image: none !important;
            }
            #threadScrollArea .composer-box {
                width: 100%;
                max-width: 700px;
                margin: 8px auto 0;
                border: 1px solid var(--paper-border-color);
                border-radius: 8px;
                max-height: none !important;
                overflow: visible !important;
                box-shadow: none !important;
            }
        }

        /* PC: 알림창 글씨는 대화 타래보다 작게 */
        @media (min-width: 768px) {
            #sideNotificationPanel .card-name { font-size: calc(12px * var(--fs-scale)); }
            #sideNotificationPanel .card-handle { font-size: calc(10px * var(--fs-scale)); }
            #sideNotificationPanel .card-body { font-size: calc(12px * var(--fs-scale)); line-height: 1.5; }
            #sideNotificationPanel .quote-text { font-size: calc(11px * var(--fs-scale)); }
            #sideNotificationPanel .mention-card .text-\[11px\] { font-size: max(9px, calc(10px * var(--fs-scale))) !important; }
        }

        /* Composer Sticky Paper Box */
        .composer-box {
            background-color: #F0F2F5;
            background-image: var(--grain-texture);
            border-top: 2px solid var(--paper-border-color);
            box-shadow: 0 -4px 12px rgba(34, 37, 46, 0.05);
        }

        /* =====================================================
           RETRO: Classic Mac (System 7) skin
           - 폰트 교체: --font-retro(본문) / --font-title(제목)만 바꾸면 됨
           ===================================================== */
        :root {
            --font-retro: 'Galmuri11', 'Pretendard Variable', Pretendard, sans-serif;
            --font-small: 'Galmuri9', 'Galmuri11', 'Pretendard Variable', sans-serif;
            --font-title: 'Galmuri14', 'Galmuri11', 'Pretendard Variable', sans-serif;
            --mac-ink: #12131A;
            --mac-paper: #FBFCFD;
            --grain-texture: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='2' height='2'%3E%3Crect width='2' height='2' fill='%23F0F2F6'/%3E%3Crect width='1' height='1' fill='%23CDD1DB'/%3E%3Crect x='1' y='1' width='1' height='1' fill='%23CDD1DB'/%3E%3C/svg%3E");
            --grid-line-pattern: none;
        }
        html, body, button, input, textarea, select { font-family: var(--font-retro) !important; -webkit-font-smoothing: none; }
        html, body { color: var(--mac-ink); image-rendering: pixelated; }
        body { font-size: calc(12px * var(--fs-scale)); }
        .text-xs:not(input):not(textarea):not(select), .text-sm:not(input):not(textarea):not(select) { font-size: calc(12px * var(--fs-scale)) !important; line-height: 1.5 !important; }
        .text-\[11px\], .text-\[10px\], .card-handle, .stamp-badge, .mention-card .text-\[11px\] { font-family: var(--font-small) !important; font-size: calc(10px * var(--fs-scale)) !important; }
        .card-name { font-size: calc(12px * var(--fs-scale)); color: var(--mac-ink); }
        .card-body { font-size: calc(12px * var(--fs-scale)); line-height: 1.7; color: var(--mac-ink); }
        .quote-block .quote-text { font-size: calc(12px * var(--fs-scale)); }
        h3, .font-bold.uppercase { font-family: var(--font-title) !important; letter-spacing: 0 !important; text-transform: none !important; }
        @media (min-width: 768px) {
            input, textarea, select { font-size: calc(12px * var(--fs-scale)); }
            #sideNotificationPanel .card-name,
            #sideNotificationPanel .card-body,
            #sideNotificationPanel .quote-text { font-family: var(--font-small) !important; font-size: calc(10px * var(--fs-scale)) !important; line-height: 1.6; }
            #sideNotificationPanel .card-name { font-weight: 700; }
        }

        /* 모서리: 전부 각지게, 버튼만 살짝 둥글게 */
        .rounded, .rounded-md, .rounded-lg, .rounded-xl, .rounded-full { border-radius: 0 !important; }
        img.rounded-full { border: 1px solid var(--mac-ink) !important; }

        /* 상단 메뉴바 */
        html body > header { background-color: var(--mac-paper) !important; background-image: none !important; backdrop-filter: none; border-bottom: 2px solid var(--mac-ink); box-shadow: none; }
        body > header .bg-neutral-800 { background: var(--mac-ink); border: 2px solid var(--mac-ink); border-radius: 0; box-shadow: 2px 2px 0 #868A99; font-family: var(--font-title); }

        /* 경계선: 먹색 1px, 안쪽 구분선은 점선 */
        .border-neutral-300 { border-color: var(--mac-ink) !important; }
        .border-neutral-200, .border-neutral-200\/80 { border-color: #868A99 !important; border-style: dotted !important; }
        .bg-neutral-100\/40, .bg-neutral-100\/30, .bg-neutral-200\/70 { background-color: var(--mac-paper) !important; }

        /* 카드 / 타래 노트 / 작성창: 흰 종이 + 딱딱한 그림자 */
        .mention-card, .thread-note, .quote-block {
            background-color: var(--mac-paper) !important; background-image: none !important;
            border: 1px solid var(--mac-ink) !important; border-radius: 0 !important;
        }
        .mention-card, .thread-note { box-shadow: 2px 2px 0 var(--mac-ink) !important; transform: none !important; }
        .mention-card:hover { background-color: #fff !important; transform: none !important; }
        .mention-card.selected-card, .thread-note-current { background-color: #D6E0F5 !important; }
        .mention-card.selected-card::after { display: none; }
        .quote-block { border-left: 3px solid var(--mac-ink) !important; box-shadow: none !important; }
        .composer-box { background-color: var(--mac-paper) !important; background-image: none !important; border-top: 2px solid var(--mac-ink); box-shadow: none; }
        #threadScrollArea .composer-box { border: 1px solid var(--mac-ink) !important; box-shadow: 2px 2px 0 var(--mac-ink) !important; }

        /* 버튼: 흰 버튼 → 누르면/올리면 반전 */
        .btn-paper, .btn-paper-dark { border: 1px solid var(--mac-ink) !important; border-radius: 5px !important; box-shadow: none !important; }
        .btn-paper { background-color: var(--mac-paper); color: var(--mac-ink); }
        .btn-paper-dark { background-color: var(--mac-ink); color: var(--mac-paper); }
        .btn-paper:hover, .btn-paper:active { background-color: var(--mac-ink); color: var(--mac-paper); }
        .btn-paper-dark:hover { background-color: #3a3d4a; }
        .btn-paper:hover *, .btn-paper-dark * { color: inherit !important; }
        .btn-paper:disabled, .btn-paper-dark:disabled { opacity: .5; }

        /* 입력칸 */
        input[type=text], input[type=password], textarea, select {
            background-color: #fff !important; border: 1px solid var(--mac-ink) !important; border-radius: 0 !important; box-shadow: none !important; color: var(--mac-ink);
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--mac-ink); outline-offset: -3px; }
        input[type=checkbox] { accent-color: var(--mac-ink); border-radius: 0 !important; }

        /* 모달: 맥 창 (줄무늬 타이틀바 + 딱딱한 그림자) */
        #settingsModal > div, #accountModal > div, #lookupModal > div, #designatedModal > div {
            background-color: var(--mac-paper) !important; border: 2px solid var(--mac-ink) !important; border-radius: 0 !important; box-shadow: 4px 4px 0 var(--mac-ink) !important;
        }
        #settingsModal > div > div:first-child, #accountModal > div > div:first-child, #lookupModal > div > div:first-child, #designatedModal > div > div:first-child {
            background: repeating-linear-gradient(to bottom, var(--mac-ink) 0 1px, transparent 1px 3px);
            border: 1px solid var(--mac-ink) !important; border-style: solid !important; padding: 3px 6px !important;
        }
        #settingsModal h3, #accountModal h3, #lookupModal h3, #designatedModal h3 { background: var(--mac-paper); padding: 0 8px; }
        #settingsModal button[onclick^="closeModal"], #accountModal button[onclick^="closeModal"], #lookupModal button[onclick^="closeModal"], #designatedModal button[onclick^="closeModal"] { background: var(--mac-paper); border: 1px solid var(--mac-ink); padding: 1px !important; color: var(--mac-ink) !important; }
        .bg-neutral-900\/40 { background-color: rgba(18, 19, 26, 0.35) !important; backdrop-filter: none !important; }
        #modalAccountList > div, #designatedList > div { background: #fff !important; border: 1px solid var(--mac-ink) !important; box-shadow: none !important; }

        /* 토스트 */
        #toastContainer > div { background: var(--mac-paper) !important; border: 2px solid var(--mac-ink) !important; border-radius: 0 !important; box-shadow: 2px 2px 0 var(--mac-ink) !important; }

        /* 지정 배지: 반전 라벨 */
        .stamp-badge { color: var(--mac-paper); background: var(--mac-ink); border: 1px solid var(--mac-ink); border-radius: 0; transform: none; opacity: 1; letter-spacing: 0; }
        .mention-tag { color: #424652; }

        /* 스크롤바: 클래식 맥 */
        ::-webkit-scrollbar { width: 14px; height: 14px; }
        ::-webkit-scrollbar-track { background: var(--grain-texture); border-left: 1px solid var(--mac-ink); }
        ::-webkit-scrollbar-thumb, ::-webkit-scrollbar-thumb:hover { background: var(--mac-paper); border: 1px solid var(--mac-ink); border-radius: 0; }

        /* ---- 추가: 선택 강조 / 타래 개수 동그라미 / 도트 아이콘 / 모바일 글씨 ---- */
        .count-dot { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 3px; border: 1px solid var(--mac-ink); border-radius: 50%; background: var(--mac-ink); color: var(--mac-paper); font-family: var(--font-small); font-size: 10px; line-height: 1; }
        svg.pxicon { image-rendering: pixelated; flex-shrink: 0; display: inline-block; }
        .reply-check svg { width: 18px; height: 18px; }
        .reply-check { color: var(--mac-ink); }
        .reply-check.checked { color: #1FA35C; }
        .btn-paper svg.pxicon, .btn-paper-dark svg.pxicon { vertical-align: middle; }
        @media (max-width: 767px) {
            :root { --font-retro: 'Galmuri9', 'Galmuri11', 'Pretendard Variable', sans-serif; }
            body, .text-xs:not(input):not(textarea):not(select), .text-sm:not(input):not(textarea):not(select),
            .card-name, .card-body, .quote-block .quote-text, .quote-missing,
            .text-\[11px\], .text-\[10px\], .card-handle { font-size: calc(12px * var(--fs-scale)) !important; }
            .card-body { line-height: 1.65; }
        }

        /* 이모지 높이 보정 */
        .emo { display: inline-block; position: relative; top: -0.14em; line-height: 1; }

        /* 타래 개수 동그라미: 작게 */
        .count-dot { min-width: 12px; height: 12px; padding: 0 2px; font-family: 'Galmuri7', var(--font-small); font-size: 8px !important; }

        /* 빈 상태 박스: 얇은 점선 */
        .border-dashed { border-width: 1px !important; border-color: var(--mac-ink) !important; }

        /* 글자 크기 슬라이더 */
        .font-slider { -webkit-appearance: none; appearance: none; height: 12px; background: var(--grain-texture); border: 1px solid var(--mac-ink); border-radius: 0; outline: none; }

        /* 로고 버튼 + 슬라이드 메뉴 (모바일·태블릿 전용, PC는 기존 헤더 유지) */
        .logo-btn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; background: var(--mac-ink); color: var(--mac-paper); border: 2px solid var(--mac-ink); box-shadow: 2px 2px 0 #868A99; font-family: var(--font-title); font-size: 12px; line-height: 1; flex-shrink: 0; cursor: pointer; }

        .menu-drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 220px; max-width: 80vw; background: var(--mac-paper); border-right: 2px solid var(--mac-ink); box-shadow: 4px 0 0 var(--mac-ink); z-index: 45; transform: translateX(-105%); transition: transform .22s steps(6, end); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
        .menu-drawer.open { transform: translateX(0); }
        .menu-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 2px solid var(--mac-ink); background: repeating-linear-gradient(to bottom, var(--mac-ink) 0 1px, transparent 1px 3px); }
        .menu-drawer-head .logo-btn { box-shadow: none; }
        .menu-close { background: var(--mac-paper); border: 1px solid var(--mac-ink); padding: 2px; color: var(--mac-ink); display: inline-flex; }

        .menu-item:hover, .menu-item:active { background: var(--mac-ink); color: var(--mac-paper); }
        @media (max-width: 1023px) {

        /* ---- v6: 선택 색 / 글자수·CW 폰트 / 알림창 너비 ---- */
        .thread-note.thread-note-current { background-color: var(--mac-paper) !important; box-shadow: 2px 2px 0 var(--mac-ink) !important; }
        #replyCharCounter, #cwToggleBtn, #replyCwInput { font-family: 'Galmuri9', 'Galmuri11', sans-serif !important; font-size: calc(10px * var(--fs-scale)) !important; }
        #replyCwInput::placeholder { font-family: 'Galmuri9', 'Galmuri11', sans-serif; }

        @media (min-width: 1024px) {

            .side-resizer:hover, body.resizing-side .side-resizer { background: var(--mac-ink); opacity: .35; }

        /* =====================================================
           v7: 버튼 높이 통일 / 메뉴·탭 글꼴 / 타래 본문 글꼴 / 작성칸
           ===================================================== */
        /* 움돋 폰트 (눈누 웹폰트) */
        @font-face {
            font-family: 'Umdot';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/Umdot12.woff2') format('woff2');

            font-display: swap;
        }
        :root { --body-font: var(--font-retro); }

        /* 3) 멘션 타래 본문만 선택한 글꼴 (알림창·메뉴·작성칸은 영향 없음) */
        #threadVisualizerContainer .card-body,
        #threadVisualizerContainer .quote-text { font-family: var(--body-font) !important; }

        /* 2) 메뉴·탭 글자는 갈무리9로 통일 */

        /* 1) 버튼 높이: 같은 자리의 버튼끼리 같은 높이 */

        #sideNotificationPanel .logo-btn { width: 28px; height: 28px; }
        #feedSearchInput { height: 28px; padding-top: 0 !important; padding-bottom: 0 !important; }

        #sendReplyBtn { padding-left: 10px !important; padding-right: 10px !important; }
        #replyVisibilityBtn:not(.hidden) { height: 22px; }

        /* 설정·계정·지정 인원·조회 창 */
        #settingsModal button.btn-paper:not(.hidden), #settingsModal button.btn-paper-dark:not(.hidden),
        #accountModal button.btn-paper:not(.hidden), #accountModal button.btn-paper-dark:not(.hidden),
        #designatedModal button.btn-paper:not(.hidden), #designatedModal button.btn-paper-dark:not(.hidden),
        #lookupModal button.btn-paper:not(.hidden), #lookupModal button.btn-paper-dark:not(.hidden) { height: 32px; }
        #modalAccountList button.btn-paper, #modalAccountList button.btn-paper-dark,
        #designatedList button.btn-paper { height: 28px !important; }
        #designatedAddInput { height: 32px; padding-top: 0 !important; padding-bottom: 0 !important; }

        /* 4) 작성창: 글쓰는 칸은 원래 크기로, 칸과 버튼 줄 사이 여백은 최소로 */
        .composer-box { padding: 10px 12px !important; row-gap: 6px !important; }
        #replyExtraParts:empty { display: none; }
        .composer-box > .flex.flex-wrap { padding-top: 0 !important; }

        /* 아래로 당겨서 새로고침 */
        #mentionsFeedContainer { overscroll-behavior-y: contain; }
        #ptrIndicator { height: 0; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--mac-ink); }
        #ptrIndicator svg { width: 14px; height: 14px; }
        #ptrIndicator .ptr-arrow { transition: transform .15s; }
        #ptrIndicator .ptr-spin { display: none; }
        #ptrIndicator.ptr-ready .ptr-arrow { transform: rotate(180deg); }
        #ptrIndicator.ptr-loading .ptr-arrow { display: none; }
        #ptrIndicator.ptr-loading .ptr-spin { display: inline-block; animation: ptrspin 0.8s steps(8) infinite; }
        @keyframes ptrspin { to { transform: rotate(360deg); } }

        /* ---- MFM ---- */
        .mfm-inl, .mfm-fx { display: inline-block; }
        .mfm-quote { border-left: 3px solid #868A99; padding: 1px 0 1px 8px; margin: 2px 0; opacity: .85; }
        .mfm-code { background: rgba(18,19,26,.08); padding: 0 3px; }
        .mfm-codeblock { background: rgba(18,19,26,.06); border: 1px solid #868A99; padding: 6px 8px; margin: 3px 0; overflow-x: auto; white-space: pre; font-family: monospace !important; }
        .mfm-link { text-decoration: underline; word-break: break-all; }
        .mfm-x2 { font-size: 200%; } .mfm-x3 { font-size: 300%; } .mfm-x4 { font-size: 400%; }
        .mfm-blur { filter: blur(6px); transition: filter .2s; cursor: pointer; }
        .mfm-blur:hover, .mfm-blur:active { filter: none; }
        .mfm-tada { font-size: 150%; animation: mfm-tada 1s linear infinite both; }
        .mfm-jelly { animation: mfm-jelly 1s linear infinite both; }
        .mfm-twitch { animation: mfm-twitch .5s ease infinite; }
        .mfm-shake { animation: mfm-shake .5s ease infinite; }
        .mfm-jump { animation: mfm-jump .75s linear infinite; }
        .mfm-bounce { animation: mfm-bounce .75s linear infinite; transform-origin: center bottom; }
        .mfm-spin { animation: mfm-spin 1.5s linear infinite; }
        .mfm-spin-x { animation-name: mfm-spinx; }
        .mfm-spin-y { animation-name: mfm-spiny; }
        .mfm-rainbow { animation: mfm-rainbow 1s linear infinite; }
        .mfm-fade { animation: mfm-fade 1.5s linear infinite alternate both; }
        @keyframes mfm-tada { 0% { transform: scale(1); } 10%, 20% { transform: scale(.91) rotate(-2deg); } 30%, 50%, 70%, 90% { transform: scale(1.09) rotate(2deg); } 40%, 60%, 80% { transform: scale(1.09) rotate(-2deg); } 100% { transform: scale(1); } }
        @keyframes mfm-jelly { 0% { transform: scale(1,1); } 30% { transform: scale(1.25,.75); } 40% { transform: scale(.75,1.25); } 50% { transform: scale(1.15,.85); } 65% { transform: scale(.95,1.05); } 75% { transform: scale(1.05,.95); } 100% { transform: scale(1,1); } }
        @keyframes mfm-twitch { 0% { transform: translate(7px,-2px); } 10% { transform: translate(-7px,-1px); } 20% { transform: translate(-8px,6px); } 30% { transform: translate(-4px,-6px); } 40% { transform: translate(4px,6px); } 50% { transform: translate(2px,-10px); } 60% { transform: translate(-2px,4px); } 70% { transform: translate(2px,-3px); } 80% { transform: translate(-7px,-8px); } 90% { transform: translate(1px,-2px); } 100% { transform: translate(3px,-8px); } }
        @keyframes mfm-shake { 0% { transform: translate(-3px,-1px) rotate(-8deg); } 10% { transform: translate(0,-1px) rotate(-10deg); } 20% { transform: translate(1px,-3px) rotate(0); } 30% { transform: translate(1px,1px) rotate(11deg); } 40% { transform: translate(-2px,1px) rotate(1deg); } 50% { transform: translate(-1px,-3px) rotate(-3deg); } 60% { transform: translate(-1px,2px) rotate(-8deg); } 70% { transform: translate(2px,1px) rotate(-10deg); } 80% { transform: translate(-2px,-2px) rotate(10deg); } 90% { transform: translate(1px,2px) rotate(2deg); } 100% { transform: translate(-3px,-1px) rotate(-8deg); } }
        @keyframes mfm-jump { 0% { transform: translateY(0); } 25% { transform: translateY(-16px); } 50% { transform: translateY(0); } 75% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
        @keyframes mfm-bounce { 0% { transform: translateY(0) scale(1,1); } 25% { transform: translateY(-16px) scale(1,1); } 50% { transform: translateY(0) scale(1,1); } 75% { transform: translateY(0) scale(1.2,.8); } 100% { transform: translateY(0) scale(1,1); } }
        @keyframes mfm-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        @keyframes mfm-spinx { from { transform: perspective(128px) rotateX(0); } to { transform: perspective(128px) rotateX(360deg); } }
        @keyframes mfm-spiny { from { transform: perspective(128px) rotateY(0); } to { transform: perspective(128px) rotateY(360deg); } }
        @keyframes mfm-rainbow { 0% { filter: hue-rotate(0) contrast(150%) saturate(150%); } 100% { filter: hue-rotate(360deg) contrast(150%) saturate(150%); } }
        @keyframes mfm-fade { from { opacity: 0; } to { opacity: 1; } }
        /* 알림 목록(작은 미리보기)에서는 움직임·큰 글씨 효과를 끔 */
        #mentionsFeedContainer .mfm-fx { animation: none !important; }
        #mentionsFeedContainer .mfm-size { font-size: inherit !important; }
        @media (prefers-reduced-motion: reduce) { .mfm-fx { animation: none !important; } }

        /* 임시저장 목록 창 */
        #draftModal > div { background-color: var(--mac-paper) !important; border: 2px solid var(--mac-ink) !important; border-radius: 0 !important; box-shadow: 4px 4px 0 var(--mac-ink) !important; }
        #draftModal > div > div:first-child { background: repeating-linear-gradient(to bottom, var(--mac-ink) 0 1px, transparent 1px 3px); border: 1px solid var(--mac-ink) !important; padding: 3px 6px !important; }
        #draftModal h3 { background: var(--mac-paper); padding: 0 8px; font-family: var(--font-title) !important; letter-spacing: 0 !important; text-transform: none !important; }
        #draftModal button[onclick^="closeModal"] { background: var(--mac-paper); border: 1px solid var(--mac-ink); padding: 1px !important; color: var(--mac-ink) !important; }
        #draftList button.btn-paper { height: 32px; justify-content: flex-start; }
    </style>
</head>
<body class="text-neutral-900 flex flex-col antialiased select-none" style="height:100vh;height:100dvh;">

    <!-- HEADER BAR -->

        <div class="flex items-center gap-1.5">

    <script>
        const STORAGE_KEY = 'MISSKEY_MW_V8_THREAD_FIX';

        let state = {
            accounts: [],
            activeAccountId: null,
            mentions: [],          // Raw loaded mention items
            designatedUsers: [],
            hiddenNoteIds: [],
            repliedNoteIds: [],    // 답장 완료 체크한 멘션 ID
            drafts: {},            // 임시저장: { 멘션ID: {at, main, parts, cw, showCw, vis} }
            selectedNoteId: null,
            threadData: { notes: [], loading: false },
            filters: { category: 'all', searchQuery: '', threadGrouping: true, onlyDesignated: true },
            replyForm: { cw: '', showCw: false },
            fontSize: '14px',
            fontPx: null,
            bodyFont: null,   // 'galmuri9' | 'galmuri11' | 'umdoteu' | null(기본)
            mobileView: 'list',   // 'list' | 'workspace'
            updatedAt: 0          // 동기화용 마지막 수정 시각
        };

        // Cache for all known notes and parent links
        const noteCache = new Map();
        const parentCache = new Map();

        /* ================= PC: 알림창 너비 (기본값 + 드래그로 조절) ================= */
        const SIDE_W_KEY = 'MISSKEY_MW_SIDE_W';
        function initSideResizer() {
            const root = document.documentElement;
            const clamp = w => Math.min(680, Math.max(320, Math.round(w)));
            const saved = Number(localStorage.getItem(SIDE_W_KEY));
            if (saved) root.style.setProperty('--side-w', clamp(saved) + 'px');
            const bar = document.getElementById('sideResizer');
            if (!bar) return;
            const side = document.getElementById('sideNotificationPanel');
            bar.addEventListener('pointerdown', e => {
                e.preventDefault();
                bar.setPointerCapture(e.pointerId);
                const startX = e.clientX, startW = side.getBoundingClientRect().width;
                document.body.classList.add('resizing-side');
                const move = ev => root.style.setProperty('--side-w', clamp(startW + ev.clientX - startX) + 'px');
                const up = () => {
                    bar.removeEventListener('pointermove', move);
                    bar.removeEventListener('pointerup', up);
                    bar.removeEventListener('pointercancel', up);
                    document.body.classList.remove('resizing-side');
                    try { localStorage.setItem(SIDE_W_KEY, String(Math.round(side.getBoundingClientRect().width))); } catch (e) {}
                };
                bar.addEventListener('pointermove', move);
                bar.addEventListener('pointerup', up);
                bar.addEventListener('pointercancel', up);
            });
            bar.addEventListener('dblclick', () => { root.style.removeProperty('--side-w'); localStorage.removeItem(SIDE_W_KEY); });
        }

        /* ================= 알림 목록: 아래로 당겨서 새로고침 (터치) ================= */
        function initPullToRefresh() {
            const box = document.getElementById('mentionsFeedContainer');
            const ind = document.getElementById('ptrIndicator');
            if (!box || !ind) return;
            const MAX = 48, THRESHOLD = 36;
            let startY = null, dist = 0, pulling = false, busy = false;

            const reset = () => {
                ind.style.transition = 'height .18s';
                ind.style.height = '0px';
                ind.classList.remove('ptr-ready', 'ptr-loading');
                pulling = false; dist = 0; startY = null;
            };

            box.addEventListener('touchstart', e => {
                if (busy || box.scrollTop > 0 || e.touches.length !== 1) { startY = null; return; }
                startY = e.touches[0].clientY; pulling = false; dist = 0;
            }, { passive: true });

            box.addEventListener('touchmove', e => {
                if (startY === null) return;
                if (box.scrollTop > 0) { reset(); return; }
                const dy = e.touches[0].clientY - startY;
                if (dy <= 0) { if (pulling) reset(); return; }
                pulling = true;
                dist = Math.min(MAX, dy * 0.5);
                ind.style.transition = 'none';
                ind.style.height = dist + 'px';
                ind.classList.toggle('ptr-ready', dist >= THRESHOLD);
            }, { passive: true });

            const end = async () => {
                if (!pulling) { startY = null; return; }
                if (dist >= THRESHOLD && !busy) {
                    busy = true;
                    ind.style.transition = 'height .15s';
                    ind.style.height = '30px';
                    ind.classList.remove('ptr-ready');
                    ind.classList.add('ptr-loading');
                    try { await manualFetchMentions(); } finally { busy = false; reset(); }
                } else {
                    reset();
                }
            };
            box.addEventListener('touchend', end);
            box.addEventListener('touchcancel', reset);
        }

        const appInit = function() {
            initSideResizer();
            initPullToRefresh();
            loadLocalState();
            loadMentionCache();
            applyFontSize();
            applyBodyFont();
            lucide.createIcons();

            if (state.accounts.length === 0) {
                openAccountManager();
            } else {
                if (!state.activeAccountId && state.accounts.length > 0) {
                    state.activeAccountId = state.accounts[0].id;
                }
                manualFetchMentions();
            }

            // Background Auto-Refresh (30 seconds)
            setInterval(() => {
                if (state.activeAccountId) {
                    silentFetchMentions();
                }
            }, 30000);

            renderAll();
            fitViewport();
            initSync();
            registerServiceWorker();
        };
        // 이미지·폰트까지 다 기다리는 window.onload 대신 DOM이 준비되면 바로 시작
        document.addEventListener('DOMContentLoaded', appInit);


        /* ================= 도트 아이콘: lucide 아이콘을 9x9 픽셀 아이콘으로 교체 ================= */
        const PIXEL_ICONS = {"bell": ["....#....", "...###...", "..#...#..", "..#...#..", "..#...#..", ".#.....#.", "#########", "....#....", "........."], "mail": [".........", ".........", "#########", "##.....##", "#.#...#.#", "#..#.#..#", "#...#...#", "#########", "........."], "send": [".........", "##.......", "####.....", "######...", "########.", "######...", "####.....", "##.......", "........."],"antenna": ["..#...#..", ".#..#..#.", ".#.###.#.", ".#..#..#.", "..#.#.#..", "....#....", "...#.#...", "..#...#..", ".#######."], "arrow-down": [".........", "....#....", "....#....", "....#....", "....#....", "#...#...#", ".#..#..#.", "..#.#.#..", "...###..."],"check": [".........", "........#", ".......##", "#.....##.", "##...##..", ".##.##...", "..###....", "...#.....", "........."], "eye": [".........", "..#####..", ".#.....#.", "#...#...#", "#..###..#", "#...#...#", ".#.....#.", "..#####..", "........."], "eye-off": [".........", ".........", "#.......#", ".#.....#.", "..#####..", ".........", ".#..#..#.", ".........", "........."], "layers": [".........", "#########", "#.......#", "#.#####.#", "#.......#", "#.#####.#", "#.......#", "#########", "........."], "save": ["#########", "#.#####.#", "#.#####.#", "#.......#", "#.#####.#", "#.#...#.#", "#.#####.#", "#########", "........."], "plus": [".........", "....#....", "....#....", "....#....", ".#######.", "....#....", "....#....", "....#....", "........."], "x": [".........", ".#.....#.", "..#...#..", "...#.#...", "....#....", "...#.#...", "..#...#..", ".#.....#.", "........."], "arrow-left": [".........", "...#.....", "..#......", ".#.......", "#########", ".#.......", "..#......", "...#.....", "........."], "arrow-right": [".........", ".....#...", "......#..", ".......#.", "#########", ".......#.", "......#..", ".....#...", "........."], "chevron-down": [".........", ".........", "#.......#", ".#.....#.", "..#...#..", "...#.#...", "....#....", ".........", "........."], "search": ["..####...", ".#....#..", "#......#.", "#......#.", "#......#.", ".#....#..", "..####.#.", "........#", "........."], "refresh-cw": [".........", "..#####..", ".#.....#.", "#.....###", "#......#.", "#........", ".#.....#.", "..#####..", "........."], "settings": ["...###...", ".#.###.#.", "..#####..", "###...###", "###...###", "###...###", "..#####..", ".#.###.#.", "...###..."], "user": [".........", "...###...", "..#...#..", "..#...#..", "...###...", ".........", ".#######.", "#.......#", "#########"], "users": [".........", ".###.###.", ".#.#.#.#.", ".###.###.", ".........", "#####.###", "#...#.#.#", "#...#.#.#", "#########"], "link": [".........", ".........", ".###.###.", "#...#...#", "#.#####.#", "#...#...#", ".###.###.", ".........", "........."], "message-square": [".........", "#########", "#.......#", "#.......#", "#.......#", "#########", ".#.......", "..#......", "........."], "book-open": [".........", ".........", "####.####", "#...#...#", "#...#...#", "#...#...#", "####.####", ".........", "........."], "inbox": [".........", ".#######.", ".#.....#.", "##.....##", "#.......#", "#.......#", "#########", ".........", "........."], "home": ["....#....", "...#.#...", "..#...#..", ".#.....#.", "##.....##", ".#.###.#.", ".#.#.#.#.", ".#.#.#.#.", ".#######."], "lock": ["...###...", "..#...#..", "..#...#..", "#########", "#.......#", "#...#...#", "#...#...#", "#.......#", "#########"], "globe": [".........", "..#####..", ".#..#..#.", "#...#...#", "#########", "#...#...#", ".#..#..#.", "..#####..", "........."], "folder": ["........." , "####.....", "#..#.....", "#########", "#.......#", "#.......#", "#.......#", "#########", "........."], "loader": ["....#....", ".........", ".#.....#.", ".........", "#.......#", ".........", ".#.....#.", ".........", "....#...."]};
        function pixelizeIcons() {
            document.querySelectorAll('i[data-lucide]').forEach(el => {
                const bm = PIXEL_ICONS[el.getAttribute('data-lucide')];
                if (!bm) return;
                let d = '';
                bm.forEach((row, y) => { for (let x = 0; x < row.length; x++) if (row[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; });
                const cls = (el.getAttribute('class') || '') + ' pxicon';
                const title = el.getAttribute('title');
                el.outerHTML = '<svg class="' + cls + '"' + (title ? ' data-title="' + title + '"' : '') + ' viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="' + d + '"/></svg>';

        /* ================= 임시저장 (동기화 연결 시 기기 간 공유) ================= */
        function composerIsEmpty() {

        // 임시저장은 '타래' 단위로 저장: 같은 타래의 멘션에서만 보임
        function threadIdSet(noteId) {
            const ids = new Set([noteId]);
            const root = getRootThreadId(noteId);
            if (root) ids.add(root);
            const tn = state.threadData && state.threadData.notes;
            if (tn && tn.some(n => n.id === noteId)) tn.forEach(n => ids.add(n.id));
            return ids;
        }
        function findDraftKeys(noteId) {
            if (!noteId) return [];
            const ids = threadIdSet(noteId);
            return Object.keys(state.drafts || {}).filter(k => {
                if (ids.has(k)) return true;
                const dids = state.drafts[k] && state.drafts[k].ids;
                return Array.isArray(dids) && dids.some(id => ids.has(id));
            });
        }
        function hasDraftForNote(noteId) { return findDraftKeys(noteId).length > 0; }

        function saveDraft() {
            const sel = state.selectedNoteId;
            if (!sel) { showToast("먼저 답장할 멘션을 선택해 주세요.", "warning"); return; }
            const existing = findDraftKeys(sel);
            if (composerIsEmpty()) {
                if (existing.length) {
                    existing.forEach(k => delete state.drafts[k]);
                    saveLocalState(); renderFeed();
                    showToast("임시저장을 지웠어요.", "info");
                } else {
                    showToast("임시저장할 내용이 없어요.", "warning");
                }
                return;
            }
            const tn = state.threadData && state.threadData.notes;
            const key = existing[0] || ((tn && tn.length && tn.some(n => n.id === sel)) ? tn[0].id : getRootThreadId(sel));
            existing.forEach(k => { if (k !== key) delete state.drafts[k]; });
            state.drafts[key] = {

                main: document.getElementById('replyTextInput').value,
                parts: [...document.querySelectorAll('#replyExtraParts textarea')].map(t => t.value),

                ids: Array.from(threadIdSet(sel)).slice(0, 80)

            const keys = Object.keys(state.drafts);

                keys.sort((a, b) => state.drafts[a].at - state.drafts[b].at).slice(0, keys.length - 60).forEach(k => delete state.drafts[k]);

        }

                navigator.serviceWorker.addEventListener('controllerchange', () => {

        /* ================= Firebase 동기화 (Realtime Database + 방 코드) ================= */
        const firebaseConfig = {
            databaseURL: "https://misskey-answer-thing-default-rtdb.firebaseio.com"
        };
        const SYNC_PHRASE_KEY = 'MISSKEY_MW_SYNC_PHRASE';
        const SYNC_JOINED_KEY = 'MISSKEY_MW_SYNC_JOINED';
        const MIN_PHRASE_LEN = 8;

        let fbDb = null, roomRef = null, offsetRef = null, aesKey = null;
        let pushTimer = null, syncConnected = false, firstSync = false, serverOffset = 0, currentRoomId = null;

        function nowMs() { return Date.now() + serverOffset; }

        // ---- 암호화 (방 코드로 만든 키로 데이터 전체를 AES-GCM 암호화) ----
        const toB64 = buf => {
            const bytes = new Uint8Array(buf);
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        };
        const fromB64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function deriveAesKey(phrase) {
            const enc = new TextEncoder();
            const base = await crypto.subtle.importKey('raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: enc.encode('misskey-mw-salt-v1'), iterations: 150000, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }

        async function encryptText(text) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, new TextEncoder().encode(text));
            const out = new Uint8Array(12 + ct.byteLength);
            out.set(iv); out.set(new Uint8Array(ct), 12);
            return toB64(out);
        }

        async function decryptText(b64) {
            const raw = fromB64(b64);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, aesKey, raw.slice(12));
            return new TextDecoder().decode(pt);
        }

        // ---- UI 상태 ----
        function setSyncStatus(text) {
            const el = document.getElementById('syncStatus');
            if (el) el.textContent = text;
            ['syncLoginBtn', 'syncPhraseInput'].forEach(id => {
                const n = document.getElementById(id);
                if (n) n.classList.toggle('hidden', syncConnected);
            });
            const outBtn = document.getElementById('syncLogoutBtn');
            if (outBtn) outBtn.classList.toggle('hidden', !syncConnected);
        }

        function showSyncError(e) {
            const code = (e && (e.code || e.message)) || 'unknown';
            let hint = '';
            if (String(code).includes('PERMISSION_DENIED')) hint = ' — Firebase Realtime Database 규칙에서 syncRooms 읽기/쓰기가 막혀 있어요';
            setSyncStatus('동기화 오류: ' + code + hint);
            showToast('동기화 오류: ' + code, 'error');
        }

        function initSync() {
            if (typeof firebase === 'undefined') {
                setSyncStatus('Firebase를 불러오지 못했어요 (이 기기에만 저장됨)');
                return;
            }
            firebase.initializeApp(firebaseConfig);
            fbDb = firebase.database();
            const saved = localStorage.getItem(SYNC_PHRASE_KEY);
            if (saved) {
                connectRoom(saved).catch(showSyncError);
            } else {
                setSyncStatus('연결 안 됨 (이 기기에만 저장됨)');
            }
        }

        async function syncLogin() {
            if (!fbDb) { showToast('Firebase가 아직 준비되지 않았어요.', 'error'); return; }
            const phrase = document.getElementById('syncPhraseInput').value.trim();
            if (phrase.length < MIN_PHRASE_LEN) {
                showToast(`동기화 문자는 ${MIN_PHRASE_LEN}자 이상으로 입력하세요.`, 'warning');
                return;
            }
            const btn = document.getElementById('syncLoginBtn');
            btn.disabled = true;
            try {
                await connectRoom(phrase);
                localStorage.setItem(SYNC_PHRASE_KEY, phrase);
                document.getElementById('syncPhraseInput').value = '';
            } catch (e) {
                console.error(e);
                showSyncError(e);
            } finally {
                btn.disabled = false;
            }
        }

        function syncLogout() {
            if (roomRef) roomRef.off();
            if (offsetRef) offsetRef.off();
            roomRef = null; offsetRef = null; aesKey = null; syncConnected = false; currentRoomId = null;
            localStorage.removeItem(SYNC_PHRASE_KEY);
            localStorage.removeItem(SYNC_JOINED_KEY);
            setSyncStatus('연결 안 됨 (이 기기에만 저장됨)');
        }

        async function connectRoom(phrase) {
            if (roomRef) roomRef.off();
            if (offsetRef) offsetRef.off();
            aesKey = await deriveAesKey(phrase);
            currentRoomId = await sha256Hex('misskey-mw-room:' + phrase);

            offsetRef = fbDb.ref('.info/serverTimeOffset');
            offsetRef.on('value', snap => { serverOffset = Number(snap.val()) || 0; });

            roomRef = fbDb.ref('syncRooms/' + currentRoomId);
            syncConnected = true;
            firstSync = localStorage.getItem(SYNC_JOINED_KEY) !== currentRoomId;
            setSyncStatus('동기화 중...');

            roomRef.on('value', handleRoomSnapshot, err => {
                console.error('sync error', err);
                showSyncError(err);
            });
        }

        function uniq(arr) { return Array.from(new Set(arr)); }
        function accountKey(a) {
            return ((a.instance || '').replace(/\/+$/, '').toLowerCase()) + '|' + ((a.user && a.user.username) || '').toLowerCase();
        }

        async function handleRoomSnapshot(snap) {
            const remote = snap.val();

            if (!remote || !remote.blob) {
                if (!state.updatedAt) { state.updatedAt = nowMs(); saveLocalState(true); }
                localStorage.setItem(SYNC_JOINED_KEY, currentRoomId);
                firstSync = false;
                pushToCloud(null, true);
                return;
            }

            let remoteData;
            try {
                remoteData = JSON.parse(await decryptText(remote.blob));
            } catch (e) {
                console.error('decrypt error', e);
                setSyncStatus('동기화 오류: 데이터를 해석하지 못했어요');
                return;
            }
            const remoteAt = remote.updatedAt || remoteData.updatedAt || 0;

            if (firstSync) {
                firstSync = false;
                localStorage.setItem(SYNC_JOINED_KEY, currentRoomId);
                mergeFirstSync(remoteData);
                setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
                return;
            }

            if (remoteAt > (state.updatedAt || 0)) {
                applyRemote(remoteData, remoteAt);
                setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
            } else if (remoteAt < (state.updatedAt || 0)) {
                pushToCloud(null, true);
            } else {
                setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
            }
        }

        function refreshAfterSync(prevActive) {
            if (!state.accounts.find(a => a.id === state.activeAccountId)) {
                state.activeAccountId = state.accounts[0]?.id || null;
            }
            renderAll();
            if (state.activeAccountId && (state.activeAccountId !== prevActive || state.mentions.length === 0)) {
                manualFetchMentions();
            }
        }

        function mergeFirstSync(remoteData) {
            const prevActive = state.activeAccountId;
            const localActive = state.accounts.find(a => a.id === state.activeAccountId);

            const map = new Map();
            [...(remoteData.accounts || []), ...state.accounts].forEach(a => {
                if (!map.has(accountKey(a))) map.set(accountKey(a), a);
            });
            state.accounts = Array.from(map.values());
            if (localActive) {
                const same = state.accounts.find(a => accountKey(a) === accountKey(localActive));
                state.activeAccountId = same ? same.id : null;
            }
            state.designatedUsers = uniq([...(remoteData.designatedUsers || []), ...state.designatedUsers]);
            state.hiddenNoteIds = uniq([...(remoteData.hiddenNoteIds || []), ...state.hiddenNoteIds]);
            state.repliedNoteIds = uniq([...(remoteData.repliedNoteIds || []), ...state.repliedNoteIds]);
            const mergedDrafts = Object.assign({}, state.drafts || {});
            Object.entries(remoteData.drafts || {}).forEach(([k, v]) => { if (!mergedDrafts[k] || (v && v.at > mergedDrafts[k].at)) mergedDrafts[k] = v; });
            state.drafts = mergedDrafts;

            state.updatedAt = nowMs();
            saveLocalState(true);
            pushToCloud(null, true);
            refreshAfterSync(prevActive);
        }

        function applyRemote(remote, remoteAt) {
            const prevActive = state.activeAccountId;
            state.accounts = remote.accounts || [];
            state.designatedUsers = remote.designatedUsers || [];
            state.hiddenNoteIds = remote.hiddenNoteIds || [];
            state.repliedNoteIds = remote.repliedNoteIds || [];
            state.drafts = remote.drafts || {};
            state.updatedAt = remoteAt || nowMs();
            saveLocalState(true);
            refreshAfterSync(prevActive);
        }

        function buildSyncPayload() {
            return {
                updatedAt: state.updatedAt,
                accounts: state.accounts,
                designatedUsers: state.designatedUsers,
                hiddenNoteIds: state.hiddenNoteIds,
                repliedNoteIds: state.repliedNoteIds,
                drafts: state.drafts
            };
        }

        function pushToCloud(_unused, immediate) {
            if (!roomRef || !aesKey) return;
            clearTimeout(pushTimer);
            const run = async () => {
                const data = buildSyncPayload();
                try {
                    const blob = await encryptText(JSON.stringify(data));
                    await roomRef.set({ updatedAt: data.updatedAt || nowMs(), blob });
                    setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
                } catch (e) {
                    console.error('push error', e);
                    showSyncError(e);
                }
            };
            if (immediate) run(); else pushTimer = setTimeout(run, 800);
        }

        // 인스턴스 주소에서 프로토콜과 끝의 '/'를 제거해 순수 호스트만 반환
        function getInstanceHost(account) {

        }

        function getActiveAccount() {
