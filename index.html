<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    
    <!-- PWA & Address Bar Display Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FBFCFD">
    <meta name="apple-mobile-web-app-title" content="MW">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <title>MW</title>

    <!-- Galmuri pixel font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">

    <!-- Pretendard Font CDN (fallback) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                        serif: ['Georgia', 'Cambria', 'Times New Roman', 'serif']
                    },
                    colors: {
                        neutral: {
                            50: '#F7F8FA', 100: '#EDEFF3', 200: '#DADDE4', 300: '#CBCED7', 400: '#868A99',
                            500: '#6F7382', 600: '#555968', 700: '#424652', 800: '#2C2F39', 900: '#1B1D25', 950: '#12131A'
                        },
                        paper: {
                            base: '#E6E8ED',
                            card: '#F0F2F5',
                            bright: '#F7F8FA',
                            line: '#D8DBE2',
                            border: '#CBCED7',
                            ink: '#22252E',
                            sub: '#555968',
                            muted: '#7F8392',
                            stamp: '#8C3A32'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --app-font-size: 14px;
            --fs-scale: 1;   /* 글자 크기 배율 (선택값 / 14px) */
            --paper-bg: #E6E8ED;
            --paper-card-bg: #F0F2F5;
            --paper-line-color: #D8DBE2;
            --paper-border-color: #CBCED7;
            --ink-text: #22252E;
            --grain-texture: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.2  0 0 0 0 0.22  0 0 0 0 0.3  0 0 0 0.05 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url%28%23n%29'/%3E%3C/svg%3E");
            --grid-line-pattern: linear-gradient(to bottom, transparent 95%, rgba(150, 154, 168, 0.16) 95%);
        }

        html, body {
            background-color: var(--paper-bg);
            background-image: var(--grain-texture);
            color: var(--ink-text);
            font-family: 'Pretendard Variable', Pretendard, sans-serif;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow: hidden;
        }
        html { font-size: 14px; }
        body { font-size: calc(14px * var(--fs-scale)); }

        /* 글자 크기 설정: 여백·아이콘은 그대로 두고 글자만 일괄 배율 적용 */
        .text-xs { font-size: calc(0.75rem * var(--fs-scale)) !important; line-height: calc(1rem * var(--fs-scale)) !important; }
        .text-sm { font-size: calc(0.875rem * var(--fs-scale)) !important; line-height: calc(1.25rem * var(--fs-scale)) !important; }
        .text-\[11px\] { font-size: calc(11px * var(--fs-scale)) !important; }
        .text-\[10px\] { font-size: max(9px, calc(10px * var(--fs-scale))) !important; }

        /* Custom Paper Minimal Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #C3C6CF;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9195A3;
        }

        /* Mobile Viewport Fix */
        body {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
            font-size: max(16px, calc(14px * var(--fs-scale)));
        }

        /* Header & Panel Transparency for Layered Paper Feel */
        body > header {
            background-color: rgba(230, 232, 237, 0.95) !important;
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--paper-border-color);
            box-shadow: 0 1px 4px rgba(34, 37, 46, 0.04);
        }

        /* Paper Note Cards */
        .mention-card {
            background-color: var(--paper-card-bg);
            background-image: var(--grain-texture);
            border: 1px solid var(--paper-border-color);
            border-radius: 8px;
            box-shadow: none;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .mention-card:hover {
            border-color: #9EA1AE;
            transform: translateY(-1px);
            box-shadow: none;
            background-color: #F4F5F8;
        }

        .mention-card.selected-card {
            border-color: #22252E;
            box-shadow: 0 0 0 1.5px #22252E;
            background-color: #F7F8FA;
        }

        /* Subtle Corner fold visual indicator for selected note */
        .mention-card.selected-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 14px 14px 0;
            border-color: transparent #22252E transparent transparent;
            border-bottom-left-radius: 2px;
        }

        /* Text Clamping */
        .preview-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ruled Lines background effect for notebook area */
        .notebook-ruled {
            background-image: var(--grain-texture), var(--grid-line-pattern);
            background-size: auto, 100% 24px;
            line-height: 24px;
        }

        /* Thread Note Cards */
        .thread-note {
            background-color: #F0F2F5;
            background-image: var(--grain-texture);
            border: 1px solid var(--paper-border-color);
            box-shadow: none;
            border-radius: 8px;
        }

        .thread-note-current {
            border-color: #22252E;
            background-color: #F7F8FA;
            box-shadow: 0 0 0 1px #22252E;
        }

        /* Quote (renote) block */
        .quote-block {
            border: 1px solid var(--paper-border-color);
            border-left: 3px solid #9195A3;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.35);
            padding: 6px 9px;
            margin-top: 2px;
            margin-bottom: 8px;
        }
        .quote-block .quote-text { font-size: calc(12px * var(--fs-scale)); line-height: 1.55; color: #30333D; }
        .quote-missing { font-size: calc(11px * var(--fs-scale)); color: #6F7382; border-style: dashed; border-left-style: dashed; }

        /* Ink & Text Typography Hierarchy */
        .card-name { font-size: calc(13px * var(--fs-scale)); font-weight: 600; color: #22252E; }
        .card-handle { font-size: calc(11px * var(--fs-scale)); font-weight: 400; color: #6F7382; }
        .card-body { font-size: calc(13px * var(--fs-scale)); line-height: 1.6; font-weight: 400; color: #1B1D25; }
        .mention-tag { color: #7A7E8D; font-weight: 500; }

        /* Stamp Badge Style */
        .stamp-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1px 7px;
            font-size: max(9px, calc(10px * var(--fs-scale)));
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #8C3A32;
            border: 1.5px dashed #8C3A32;
            border-radius: 4px;
            transform: rotate(-2deg);
            opacity: 0.9;
            background-color: rgba(140, 58, 50, 0.04);
        }

        /* Reply check: 간결한 V자 (누르면 초록색) */
        .reply-check {
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--ink-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
        }
        .reply-check svg { width: 16px; height: 16px; }
        .reply-check:hover { opacity: 0.65; }
        .reply-check:active { transform: scale(0.88); }
        .reply-check.checked { color: #1FA35C; }

        /* Tactile Paper Button Effects */
        .btn-paper {
            background-color: #F0F2F5;
            border: 1px solid var(--paper-border-color);
            color: var(--ink-text);
            box-shadow: 0 1px 2px rgba(34, 37, 46, 0.06);
            transition: all 0.15s ease;
        }
        .btn-paper:hover {
            background-color: #F7F8FA;
            border-color: #9EA1AE;
            box-shadow: 0 2px 4px rgba(34, 37, 46, 0.09);
        }
        .btn-paper-dark {
            background-color: #22252E;
            border: 1px solid #22252E;
            color: #F0F2F5;
            box-shadow: 0 2px 4px rgba(34, 37, 46, 0.15);
            transition: all 0.15s ease;
        }
        .btn-paper-dark:hover {
            background-color: #30333D;
            box-shadow: 0 3px 6px rgba(34, 37, 46, 0.22);
        }

        /* 모바일: 스크롤 래퍼는 레이아웃에 영향 없음 (기존처럼 타래 + 하단 고정 작성창) */
        #threadScrollArea { display: contents; }

        /* PC: 타래와 작성창을 한 스크롤 영역에 두고, 작성창을 노트 바로 아래에 붙임 */
        @media (min-width: 768px) {
            #threadScrollArea {
                display: block;
                flex: 1 1 0%;
                min-height: 0;
                overflow-y: auto;
                padding: 16px;
                background-image: var(--grain-texture), var(--grid-line-pattern);
                background-size: auto, 100% 24px;
            }
            #threadVisualizerContainer {
                flex: none !important;
                overflow: visible !important;
                padding: 0 !important;
                background-image: none !important;
            }
            #threadScrollArea .composer-box {
                width: 100%;
                max-width: 700px;
                margin: 8px auto 0;
                border: 1px solid var(--paper-border-color);
                border-radius: 8px;
                max-height: none !important;
                overflow: visible !important;
                box-shadow: none !important;
            }
        }

        /* PC: 알림창 글씨는 대화 타래보다 작게 */
        @media (min-width: 768px) {
            #sideNotificationPanel .card-name { font-size: calc(12px * var(--fs-scale)); }
            #sideNotificationPanel .card-handle { font-size: calc(10px * var(--fs-scale)); }
            #sideNotificationPanel .card-body { font-size: calc(12px * var(--fs-scale)); line-height: 1.5; }
            #sideNotificationPanel .quote-text { font-size: calc(11px * var(--fs-scale)); }
            #sideNotificationPanel .mention-card .text-\[11px\] { font-size: max(9px, calc(10px * var(--fs-scale))) !important; }
        }

        /* Composer Sticky Paper Box */
        .composer-box {
            background-color: #F0F2F5;
            background-image: var(--grain-texture);
            border-top: 2px solid var(--paper-border-color);
            box-shadow: 0 -4px 12px rgba(34, 37, 46, 0.05);
        }

        /* =====================================================
           RETRO: Classic Mac (System 7) skin
           - 폰트 교체: --font-retro(본문) / --font-title(제목)만 바꾸면 됨
           ===================================================== */
        :root {
            --font-retro: 'Galmuri11', 'Pretendard Variable', Pretendard, sans-serif;
            --font-small: 'Galmuri9', 'Galmuri11', 'Pretendard Variable', sans-serif;
            --font-title: 'Galmuri14', 'Galmuri11', 'Pretendard Variable', sans-serif;
            --mac-ink: #12131A;
            --mac-paper: #FBFCFD;
            --grain-texture: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='2' height='2'%3E%3Crect width='2' height='2' fill='%23F0F2F6'/%3E%3Crect width='1' height='1' fill='%23CDD1DB'/%3E%3Crect x='1' y='1' width='1' height='1' fill='%23CDD1DB'/%3E%3C/svg%3E");
            --grid-line-pattern: none;
        }
        html, body, button, input, textarea, select { font-family: var(--font-retro) !important; -webkit-font-smoothing: none; }
        html, body { color: var(--mac-ink); image-rendering: pixelated; }
        body { font-size: calc(12px * var(--fs-scale)); }
        .text-xs, .text-sm { font-size: calc(12px * var(--fs-scale)) !important; line-height: 1.5 !important; }
        .text-\[11px\], .text-\[10px\], .card-handle, .stamp-badge, .mention-card .text-\[11px\] { font-family: var(--font-small) !important; font-size: calc(10px * var(--fs-scale)) !important; }
        .card-name { font-size: calc(12px * var(--fs-scale)); color: var(--mac-ink); }
        .card-body { font-size: calc(12px * var(--fs-scale)); line-height: 1.7; color: var(--mac-ink); }
        .quote-block .quote-text { font-size: calc(12px * var(--fs-scale)); }
        h3, .font-bold.uppercase { font-family: var(--font-title) !important; letter-spacing: 0 !important; text-transform: none !important; }
        @media (min-width: 768px) {
            input, textarea, select { font-size: calc(12px * var(--fs-scale)); }
            #sideNotificationPanel .card-name,
            #sideNotificationPanel .card-body,
            #sideNotificationPanel .quote-text { font-family: var(--font-small) !important; font-size: calc(10px * var(--fs-scale)) !important; line-height: 1.6; }
            #sideNotificationPanel .card-name { font-weight: 700; }
        }

        /* 모서리: 전부 각지게, 버튼만 살짝 둥글게 */
        .rounded, .rounded-md, .rounded-lg, .rounded-xl, .rounded-full { border-radius: 0 !important; }
        img.rounded-full { border: 1px solid var(--mac-ink) !important; }

        /* 상단 메뉴바 */
        html body > header { background-color: var(--mac-paper) !important; background-image: none !important; backdrop-filter: none; border-bottom: 2px solid var(--mac-ink); box-shadow: none; }
        body > header .bg-neutral-800 { background: var(--mac-ink); border: 2px solid var(--mac-ink); border-radius: 0; box-shadow: 2px 2px 0 #868A99; font-family: var(--font-title); }

        /* 경계선: 먹색 1px, 안쪽 구분선은 점선 */
        .border-neutral-300 { border-color: var(--mac-ink) !important; }
        .border-neutral-200, .border-neutral-200\/80 { border-color: #868A99 !important; border-style: dotted !important; }
        .bg-neutral-100\/40, .bg-neutral-100\/30, .bg-neutral-200\/70 { background-color: var(--mac-paper) !important; }

        /* 카드 / 타래 노트 / 작성창: 흰 종이 + 딱딱한 그림자 */
        .mention-card, .thread-note, .quote-block {
            background-color: var(--mac-paper) !important; background-image: none !important;
            border: 1px solid var(--mac-ink) !important; border-radius: 0 !important;
        }
        .mention-card, .thread-note { box-shadow: 2px 2px 0 var(--mac-ink) !important; transform: none !important; }
        .mention-card:hover { background-color: #fff !important; transform: none !important; }
        .mention-card.selected-card, .thread-note-current { box-shadow: 2px 2px 0 var(--mac-ink), inset 0 0 0 2px var(--mac-ink) !important; }
        .mention-card.selected-card::after { display: none; }
        .quote-block { border-left: 3px solid var(--mac-ink) !important; box-shadow: none !important; }
        .composer-box { background-color: var(--mac-paper) !important; background-image: none !important; border-top: 2px solid var(--mac-ink); box-shadow: none; }
        #threadScrollArea .composer-box { border: 1px solid var(--mac-ink) !important; box-shadow: 2px 2px 0 var(--mac-ink) !important; }

        /* 버튼: 흰 버튼 → 누르면/올리면 반전 */
        .btn-paper, .btn-paper-dark { border: 1px solid var(--mac-ink) !important; border-radius: 5px !important; box-shadow: none !important; }
        .btn-paper { background-color: var(--mac-paper); color: var(--mac-ink); }
        .btn-paper-dark { background-color: var(--mac-ink); color: var(--mac-paper); }
        .btn-paper:hover, .btn-paper:active { background-color: var(--mac-ink); color: var(--mac-paper); }
        .btn-paper-dark:hover { background-color: #3a3d4a; }
        .btn-paper:hover *, .btn-paper-dark * { color: inherit !important; }
        .btn-paper:disabled, .btn-paper-dark:disabled { opacity: .5; }

        /* 입력칸 */
        input[type=text], input[type=password], textarea, select {
            background-color: #fff !important; border: 1px solid var(--mac-ink) !important; border-radius: 0 !important; box-shadow: none !important; color: var(--mac-ink);
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--mac-ink); outline-offset: -3px; }
        input[type=checkbox] { accent-color: var(--mac-ink); border-radius: 0 !important; }

        /* 모달: 맥 창 (줄무늬 타이틀바 + 딱딱한 그림자) */
        #settingsModal > div, #accountModal > div, #lookupModal > div, #designatedModal > div {
            background-color: var(--mac-paper) !important; border: 2px solid var(--mac-ink) !important; border-radius: 0 !important; box-shadow: 4px 4px 0 var(--mac-ink) !important;
        }
        #settingsModal > div > div:first-child, #accountModal > div > div:first-child, #lookupModal > div > div:first-child, #designatedModal > div > div:first-child {
            background: repeating-linear-gradient(to bottom, var(--mac-ink) 0 1px, transparent 1px 3px);
            border: 1px solid var(--mac-ink) !important; border-style: solid !important; padding: 3px 6px !important;
        }
        #settingsModal h3, #accountModal h3, #lookupModal h3, #designatedModal h3 { background: var(--mac-paper); padding: 0 8px; }
        #settingsModal button[onclick^="closeModal"], #accountModal button[onclick^="closeModal"], #lookupModal button[onclick^="closeModal"], #designatedModal button[onclick^="closeModal"] { background: var(--mac-paper); border: 1px solid var(--mac-ink); padding: 1px !important; color: var(--mac-ink) !important; }
        .bg-neutral-900\/40 { background-color: rgba(18, 19, 26, 0.35) !important; backdrop-filter: none !important; }
        #modalAccountList > div, #designatedList > div { background: #fff !important; border: 1px solid var(--mac-ink) !important; box-shadow: none !important; }

        /* 토스트 */
        #toastContainer > div { background: var(--mac-paper) !important; border: 2px solid var(--mac-ink) !important; border-radius: 0 !important; box-shadow: 2px 2px 0 var(--mac-ink) !important; }

        /* 지정 배지: 반전 라벨 */
        .stamp-badge { color: var(--mac-paper); background: var(--mac-ink); border: 1px solid var(--mac-ink); border-radius: 0; transform: none; opacity: 1; letter-spacing: 0; }
        .mention-tag { color: #424652; }

        /* 스크롤바: 클래식 맥 */
        ::-webkit-scrollbar { width: 14px; height: 14px; }
        ::-webkit-scrollbar-track { background: var(--grain-texture); border-left: 1px solid var(--mac-ink); }
        ::-webkit-scrollbar-thumb, ::-webkit-scrollbar-thumb:hover { background: var(--mac-paper); border: 1px solid var(--mac-ink); border-radius: 0; }
    </style>
</head>
<body class="text-neutral-900 flex flex-col antialiased select-none" style="height:100vh;height:100dvh;">

    <!-- HEADER BAR -->
    <header class="h-14 px-4 py-2.5 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded border-1.5 border-neutral-800 flex items-center justify-center font-bold text-xs bg-neutral-800 text-neutral-100 shadow-sm">
                M
            </div>
        </div>

        <div class="flex items-center gap-1.5">
            <!-- Settings Modal Button -->
            <button onclick="openModal('settingsModal')" class="btn-paper px-2.5 py-1.5 rounded-md text-neutral-700 text-xs font-medium flex items-center gap-1.5">
                <i data-lucide="settings" class="w-3.5 h-3.5 text-neutral-500"></i>
                <span class="hidden sm:inline">설정</span>
            </button>

            <!-- Designated Users Button -->
            <button onclick="openDesignatedManager()" class="btn-paper px-2.5 py-1.5 rounded-md text-neutral-700 text-xs font-medium flex items-center gap-1.5">
                <i data-lucide="users" class="w-3.5 h-3.5 text-neutral-500"></i>
                <span class="hidden sm:inline">지정 인원</span>
            </button>

            <!-- Direct Note Lookup Button -->
            <button onclick="openModal('lookupModal')" class="btn-paper px-2.5 py-1.5 rounded-md text-neutral-700 text-xs font-medium flex items-center gap-1.5">
                <i data-lucide="search" class="w-3.5 h-3.5 text-neutral-500"></i>
                <span class="hidden sm:inline">조회</span>
            </button>

            <!-- Active Account Selector Button -->
            <button onclick="openAccountManager()" id="accountSelectBtn" class="btn-paper px-2.5 py-1.5 rounded-md text-xs font-medium text-neutral-800 flex items-center gap-1.5">
                <i data-lucide="user" class="w-3.5 h-3.5 text-neutral-500"></i>
                <span id="activeAccountLabel" class="max-w-[110px] truncate">계정 연결</span>
                <i data-lucide="chevron-down" class="w-3 h-3 text-neutral-400"></i>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE & SIDEBAR CONTAINER -->
    <div class="flex-1 min-h-0 flex overflow-hidden relative">

        <!-- SIDEBAR: NOTIFICATION & MENTION LIST -->
        <aside id="sideNotificationPanel" class="w-full md:w-80 lg:w-96 border-r border-neutral-300 flex flex-col h-full shrink-0 z-10 transition-all duration-200">
            
            <!-- Category Filter Header -->
            <div class="p-2.5 border-b border-neutral-300 bg-neutral-100/40 flex flex-wrap items-center justify-between gap-1.5 shrink-0">

    <script>
        const STORAGE_KEY = 'MISSKEY_MW_V8_THREAD_FIX';

        let state = {
            accounts: [],
            activeAccountId: null,
            mentions: [],          // Raw loaded mention items
            designatedUsers: [],
            hiddenNoteIds: [],
            repliedNoteIds: [],    // 답장 완료 체크한 멘션 ID
            selectedNoteId: null,
            threadData: { notes: [], loading: false },
            filters: { category: 'all', searchQuery: '', threadGrouping: true, onlyDesignated: true },
            replyForm: { cw: '', showCw: false },
            fontSize: '14px',
            mobileView: 'list',   // 'list' | 'workspace'
            updatedAt: 0          // 동기화용 마지막 수정 시각
        };

        // Cache for all known notes and parent links
        const noteCache = new Map();
        const parentCache = new Map();

        window.onload = function() {
            loadLocalState();
            applyFontSize(state.fontSize);
            lucide.createIcons();

            if (state.accounts.length === 0) {
                openAccountManager();
            } else {
                if (!state.activeAccountId && state.accounts.length > 0) {
                    state.activeAccountId = state.accounts[0].id;
                }
                manualFetchMentions();
            }

            // Background Auto-Refresh (30 seconds)
            setInterval(() => {
                if (state.activeAccountId) {
                    silentFetchMentions();
                }
            }, 30000);

            renderAll();
            fitViewport();
            initSync();
            registerServiceWorker();
        };

        function loadLocalState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.accounts = parsed.accounts || [];
                    state.activeAccountId = parsed.activeAccountId || null;
                    state.designatedUsers = parsed.designatedUsers || [];
                    state.hiddenNoteIds = parsed.hiddenNoteIds || [];
                    state.repliedNoteIds = parsed.repliedNoteIds || [];
                    state.fontSize = parsed.fontSize || '14px';
                    state.updatedAt = parsed.updatedAt || 0;
                    if (typeof parsed.onlyDesignated === 'boolean') {
                        state.filters.onlyDesignated = parsed.onlyDesignated;
                    }
                    if (typeof parsed.threadGrouping === 'boolean') {
                        state.filters.threadGrouping = parsed.threadGrouping;
                    }
                }
            } catch (e) {
                console.error("Local load error:", e);
            }
        }

        function buildLocalPayload() {
            return {
                updatedAt: state.updatedAt,
                accounts: state.accounts,
                activeAccountId: state.activeAccountId,
                designatedUsers: state.designatedUsers,
                hiddenNoteIds: state.hiddenNoteIds,
                repliedNoteIds: state.repliedNoteIds,
                fontSize: state.fontSize,
                threadGrouping: state.filters.threadGrouping,
                onlyDesignated: state.filters.onlyDesignated
            };
        }

        function saveLocalState(skipSync) {
            try {
                if (state.repliedNoteIds.length > 3000) state.repliedNoteIds = state.repliedNoteIds.slice(-3000);
                if (state.hiddenNoteIds.length > 3000) state.hiddenNoteIds = state.hiddenNoteIds.slice(-3000);
                if (!skipSync) state.updatedAt = nowMs();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(buildLocalPayload()));
                if (!skipSync) pushToCloud();
            } catch (e) {
                console.error("Local save error:", e);
            }
        }

        /* ================= 모바일 화면 높이 보정 ================= */
        function fitViewport() {
            const vv = window.visualViewport;
            const h = vv ? vv.height : window.innerHeight;
            document.body.style.height = h + 'px';
            document.body.style.transform = vv ? `translateY(${vv.offsetTop}px)` : '';
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fitViewport);
            window.visualViewport.addEventListener('scroll', fitViewport);
        }
        window.addEventListener('resize', fitViewport);
        window.addEventListener('orientationchange', () => setTimeout(fitViewport, 200));

        function registerServiceWorker() {
            if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
                const hadController = !!navigator.serviceWorker.controller;
                let reloaded = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!hadController || reloaded) return;   // 최초 설치 때는 새로고침하지 않음
                    reloaded = true;
                    location.reload();
                });
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(reg => reg.update())
                    .catch(e => console.warn('SW 등록 실패', e));
            }
        }

        /* ================= Firebase 동기화 (Realtime Database + 방 코드) ================= */
        const firebaseConfig = {
            databaseURL: "https://misskey-answer-thing-default-rtdb.firebaseio.com"
        };
        const SYNC_PHRASE_KEY = 'MISSKEY_MW_SYNC_PHRASE';
        const SYNC_JOINED_KEY = 'MISSKEY_MW_SYNC_JOINED';
        const MIN_PHRASE_LEN = 8;

        let fbDb = null, roomRef = null, offsetRef = null, aesKey = null;
        let pushTimer = null, syncConnected = false, firstSync = false, serverOffset = 0, currentRoomId = null;

        function nowMs() { return Date.now() + serverOffset; }

        // ---- 암호화 (방 코드로 만든 키로 데이터 전체를 AES-GCM 암호화) ----
        const toB64 = buf => {
            const bytes = new Uint8Array(buf);
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        };
        const fromB64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function deriveAesKey(phrase) {
            const enc = new TextEncoder();
            const base = await crypto.subtle.importKey('raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: enc.encode('misskey-mw-salt-v1'), iterations: 150000, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }

        async function encryptText(text) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, new TextEncoder().encode(text));
            const out = new Uint8Array(12 + ct.byteLength);
            out.set(iv); out.set(new Uint8Array(ct), 12);
            return toB64(out);
        }

        async function decryptText(b64) {
            const raw = fromB64(b64);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, aesKey, raw.slice(12));
            return new TextDecoder().decode(pt);
        }

        // ---- UI 상태 ----
        function setSyncStatus(text) {
            const el = document.getElementById('syncStatus');
            if (el) el.textContent = text;
            ['syncLoginBtn', 'syncPhraseInput'].forEach(id => {
                const n = document.getElementById(id);
                if (n) n.classList.toggle('hidden', syncConnected);
            });
            const outBtn = document.getElementById('syncLogoutBtn');
            if (outBtn) outBtn.classList.toggle('hidden', !syncConnected);
        }

        function showSyncError(e) {
            const code = (e && (e.code || e.message)) || 'unknown';
            let hint = '';
            if (String(code).includes('PERMISSION_DENIED')) hint = ' — Firebase Realtime Database 규칙에서 syncRooms 읽기/쓰기가 막혀 있어요';
            setSyncStatus('동기화 오류: ' + code + hint);
            showToast('동기화 오류: ' + code, 'error');
        }

        function initSync() {
            if (typeof firebase === 'undefined') {
                setSyncStatus('Firebase를 불러오지 못했어요 (이 기기에만 저장됨)');
                return;
            }
            firebase.initializeApp(firebaseConfig);
            fbDb = firebase.database();
            const saved = localStorage.getItem(SYNC_PHRASE_KEY);
            if (saved) {
                connectRoom(saved).catch(showSyncError);
            } else {
                setSyncStatus('연결 안 됨 (이 기기에만 저장됨)');
            }
        }

        async function syncLogin() {
            if (!fbDb) { showToast('Firebase가 아직 준비되지 않았어요.', 'error'); return; }
            const phrase = document.getElementById('syncPhraseInput').value.trim();
            if (phrase.length < MIN_PHRASE_LEN) {
                showToast(`동기화 문자는 ${MIN_PHRASE_LEN}자 이상으로 입력하세요.`, 'warning');
                return;
            }
            const btn = document.getElementById('syncLoginBtn');
            btn.disabled = true;
            try {
                await connectRoom(phrase);
                localStorage.setItem(SYNC_PHRASE_KEY, phrase);
                document.getElementById('syncPhraseInput').value = '';
            } catch (e) {
                console.error(e);
                showSyncError(e);
            } finally {
                btn.disabled = false;
            }
        }

        function syncLogout() {
            if (roomRef) roomRef.off();
            if (offsetRef) offsetRef.off();
            roomRef = null; offsetRef = null; aesKey = null; syncConnected = false; currentRoomId = null;
            localStorage.removeItem(SYNC_PHRASE_KEY);
            localStorage.removeItem(SYNC_JOINED_KEY);
            setSyncStatus('연결 안 됨 (이 기기에만 저장됨)');
        }

        async function connectRoom(phrase) {
            if (roomRef) roomRef.off();
            if (offsetRef) offsetRef.off();
            aesKey = await deriveAesKey(phrase);
            currentRoomId = await sha256Hex('misskey-mw-room:' + phrase);

            offsetRef = fbDb.ref('.info/serverTimeOffset');
            offsetRef.on('value', snap => { serverOffset = Number(snap.val()) || 0; });

            roomRef = fbDb.ref('syncRooms/' + currentRoomId);
            syncConnected = true;
            firstSync = localStorage.getItem(SYNC_JOINED_KEY) !== currentRoomId;
            setSyncStatus('동기화 중...');

            roomRef.on('value', handleRoomSnapshot, err => {
                console.error('sync error', err);
                showSyncError(err);
            });
        }

        function uniq(arr) { return Array.from(new Set(arr)); }
        function accountKey(a) {
            return ((a.instance || '').replace(/\/+$/, '').toLowerCase()) + '|' + ((a.user && a.user.username) || '').toLowerCase();
        }

        async function handleRoomSnapshot(snap) {
            const remote = snap.val();

            if (!remote || !remote.blob) {
                if (!state.updatedAt) { state.updatedAt = nowMs(); saveLocalState(true); }
                localStorage.setItem(SYNC_JOINED_KEY, currentRoomId);
                firstSync = false;
                pushToCloud(null, true);
                return;
            }

            let remoteData;
            try {
                remoteData = JSON.parse(await decryptText(remote.blob));
            } catch (e) {
                console.error('decrypt error', e);
                setSyncStatus('동기화 오류: 데이터를 해석하지 못했어요');
                return;
            }
            const remoteAt = remote.updatedAt || remoteData.updatedAt || 0;

            if (firstSync) {
                firstSync = false;
                localStorage.setItem(SYNC_JOINED_KEY, currentRoomId);
                mergeFirstSync(remoteData);
                setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
                return;
            }

            if (remoteAt > (state.updatedAt || 0)) {
                applyRemote(remoteData, remoteAt);
                setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
            } else if (remoteAt < (state.updatedAt || 0)) {
                pushToCloud(null, true);
            } else {
                setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
            }
        }

        function refreshAfterSync(prevActive) {
            if (!state.accounts.find(a => a.id === state.activeAccountId)) {
                state.activeAccountId = state.accounts[0]?.id || null;
            }
            renderAll();
            if (state.activeAccountId && (state.activeAccountId !== prevActive || state.mentions.length === 0)) {
                manualFetchMentions();
            }
        }

        function mergeFirstSync(remoteData) {
            const prevActive = state.activeAccountId;
            const localActive = state.accounts.find(a => a.id === state.activeAccountId);

            const map = new Map();
            [...(remoteData.accounts || []), ...state.accounts].forEach(a => {
                if (!map.has(accountKey(a))) map.set(accountKey(a), a);
            });
            state.accounts = Array.from(map.values());
            if (localActive) {
                const same = state.accounts.find(a => accountKey(a) === accountKey(localActive));
                state.activeAccountId = same ? same.id : null;
            }
            state.designatedUsers = uniq([...(remoteData.designatedUsers || []), ...state.designatedUsers]);
            state.hiddenNoteIds = uniq([...(remoteData.hiddenNoteIds || []), ...state.hiddenNoteIds]);
            state.repliedNoteIds = uniq([...(remoteData.repliedNoteIds || []), ...state.repliedNoteIds]);

            state.updatedAt = nowMs();
            saveLocalState(true);
            pushToCloud(null, true);
            refreshAfterSync(prevActive);
        }

        function applyRemote(remote, remoteAt) {
            const prevActive = state.activeAccountId;
            state.accounts = remote.accounts || [];
            state.designatedUsers = remote.designatedUsers || [];
            state.hiddenNoteIds = remote.hiddenNoteIds || [];
            state.repliedNoteIds = remote.repliedNoteIds || [];
            state.updatedAt = remoteAt || nowMs();
            saveLocalState(true);
            refreshAfterSync(prevActive);
        }

        function buildSyncPayload() {
            return {
                updatedAt: state.updatedAt,
                accounts: state.accounts,
                designatedUsers: state.designatedUsers,
                hiddenNoteIds: state.hiddenNoteIds,
                repliedNoteIds: state.repliedNoteIds
            };
        }

        function pushToCloud(_unused, immediate) {
            if (!roomRef || !aesKey) return;
            clearTimeout(pushTimer);
            const run = async () => {
                const data = buildSyncPayload();
                try {
                    const blob = await encryptText(JSON.stringify(data));
                    await roomRef.set({ updatedAt: data.updatedAt || nowMs(), blob });
                    setSyncStatus('동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
                } catch (e) {
                    console.error('push error', e);
                    showSyncError(e);
                }
            };
            if (immediate) run(); else pushTimer = setTimeout(run, 800);
        }

        function setFontSize(size) {
            state.fontSize = size;
            applyFontSize(size);
            saveLocalState(true);   // 글자 크기는 기기별 설정: 동기화 시각을 갱신하거나 클라우드에 올리지 않음
            updateFontSizeUI();
        }

        function applyFontSize(size) {
            const px = parseFloat(size) || 14;
            document.documentElement.style.setProperty('--app-font-size', px + 'px');
            document.documentElement.style.setProperty('--fs-scale', String(px / 14));
        }

        function updateFontSizeUI() {
            ['12px', '14px', '16px', '18px'].forEach(sz => {
                const btn = document.getElementById(`fontSizeBtn-${sz}`);
                if (btn) {
                    btn.className = (state.fontSize === sz)
                        ? 'btn-paper-dark py-2 rounded-md text-xs font-medium'
                        : 'btn-paper py-2 rounded-md text-xs font-medium';
                }
            });
        }

        // 인스턴스 주소에서 프로토콜과 끝의 '/'를 제거해 순수 호스트만 반환
        function getInstanceHost(account) {
            return String(account.instance || '').trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
        }

        function getActiveAccount() {
            return state.accounts.find(a => a.id === state.activeAccountId) || null;
        }

        async function misskeyApiCall(instanceUrl, endpoint, body = {}) {
            const cleanUrl = instanceUrl.replace(/\/+$/, '');
            const targetUrl = `${cleanUrl}/api/${endpoint.replace(/^\//, '')}`;
            
            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API 오류 (${response.status}): ${errText}`);
            }
            return await response.json();
        }

        function cacheNoteHierarchy(rawNote, defaultHost = '') {
            if (!rawNote || !rawNote.id) return null;

            const parsed = {
                id: rawNote.id,
                user: {
                    name: rawNote.user?.name || rawNote.user?.username || '알 수 없음',
                    username: rawNote.user?.username || 'unknown',
                    host: rawNote.user?.host || defaultHost,
                    avatarUrl: rawNote.user?.avatarUrl || 'https://placehold.co/80x80/E6E8ED/22252E?text=U'
                },
                text: rawNote.text || '',
                cw: rawNote.cw || null,
                createdAt: rawNote.createdAt,
                visibility: rawNote.visibility || 'public',
                visibleUserIds: rawNote.visibleUserIds || [],
                replyId: rawNote.replyId || null,
                renoteId: rawNote.renoteId || null,
                renote: rawNote.renote ? {
                    id: rawNote.renote.id,
                    user: {
                        name: rawNote.renote.user?.name || rawNote.renote.user?.username || '알 수 없음',
                        username: rawNote.renote.user?.username || 'unknown',
                        host: rawNote.renote.user?.host || defaultHost,
                        avatarUrl: rawNote.renote.user?.avatarUrl || 'https://placehold.co/80x80/F0F2F5/22252E?text=U'
                    },
                    text: rawNote.renote.text || '',
                    cw: rawNote.renote.cw || null,
                    createdAt: rawNote.renote.createdAt,
                    fileCount: Array.isArray(rawNote.renote.files) ? rawNote.renote.files.length : 0
                } : null
            };

            noteCache.set(parsed.id, parsed);

            if (rawNote.reply) {
                parentCache.set(parsed.id, rawNote.reply.id);
                cacheNoteHierarchy(rawNote.reply, defaultHost);
            } else if (parsed.replyId) {
                parentCache.set(parsed.id, parsed.replyId);
            }

            return parsed;
        }

        function getRootThreadId(noteId) {
            let currentId = noteId;
            const visited = new Set();

            while (currentId && !visited.has(currentId)) {
                visited.add(currentId);
                const parentId = parentCache.get(currentId);
                if (!parentId) break;
                currentId = parentId;
            }

            return currentId || noteId;
        }

        function mergeNotes(newParsedNotes) {
            const existingMap = new Map(state.mentions.map(m => [m.id, m]));
            newParsedNotes.forEach(n => existingMap.set(n.id, n));

            state.mentions = Array.from(existingMap.values()).sort((a, b) => {
                return new Date(b.createdAt) - new Date(a.createdAt);
            });
        }

        async function fetchMentionsApi(untilId = null) {
            const account = getActiveAccount();
            if (!account) return;

            const defaultHost = getInstanceHost(account);
            const payload = { i: account.token, limit: 30 };
            if (untilId) payload.untilId = untilId;

            const result = await misskeyApiCall(account.instance, 'notes/mentions', payload);

            let parsedList = [];
            if (Array.isArray(result)) {
                parsedList = result.map(raw => cacheNoteHierarchy(raw, defaultHost));
            }

            // 인용 노트는 notes/mentions에 안 잡히므로 인용 알림에서 따로 가져옴
            const quoteList = await fetchQuoteNotes(account, defaultHost, !!untilId);

            if (parsedList.length > 0 || quoteList.length > 0) {
                mergeNotes(parsedList.concat(quoteList));
                renderFeed();
                renderFilters();
            }
        }

        let quoteCursor = null;      // 인용 알림 페이지네이션 커서 (알림 id)
        let quoteWarned = false;

        async function fetchQuoteNotes(account, defaultHost, older) {
            try {
                const payload = {
                    i: account.token,
                    limit: 30,
                    includeTypes: ['quote'],
                    markAsRead: false   // 불러오기만 하고 읽음 처리는 하지 않음
                };
                if (older && quoteCursor) payload.untilId = quoteCursor;

                const res = await misskeyApiCall(account.instance, 'i/notifications', payload);
                if (!Array.isArray(res) || res.length === 0) return [];

                const oldest = res[res.length - 1]?.id;
                if (oldest && (older || !quoteCursor)) quoteCursor = oldest;

                return res
                    .filter(n => n && n.note)
                    .map(n => cacheNoteHierarchy(n.note, defaultHost))
                    .filter(Boolean);
            } catch (err) {
                if (!quoteWarned) {
                    quoteWarned = true;
                    showToast("인용 노트를 불러오지 못했어요. 토큰에 '알림 읽기(read:notifications)' 권한이 있는지 확인해 주세요.", "warning");
                }
                console.warn("인용 알림 로드 실패:", err);
                return [];
            }
        }

        async function manualFetchMentions() {
            const account = getActiveAccount();
            if (!account) {
                showToast("등록된 계정이 없습니다.", "warning");
                return;
            }
            try {
                await fetchMentionsApi(null);
                showToast("멘션 목록을 새로고침했습니다.", "success");
            } catch (err) {
                showToast(`새로고침 실패: ${err.message}`, "error");
            }
        }

        async function fetchOlderMentions() {
            if (state.mentions.length === 0) return manualFetchMentions();

            const oldestId = state.mentions[state.mentions.length - 1].id;
            const btn = document.getElementById('loadOlderBtn');
            btn.disabled = true;

            try {
                await fetchMentionsApi(oldestId);
                showToast("이전 멘션을 불러왔습니다.", "success");
            } catch (err) {
                showToast(`불러오기 실패: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
            }
        }

        async function silentFetchMentions() {
            const account = getActiveAccount();
            if (!account) return;
            try {
                await fetchMentionsApi(null);
            } catch (e) {}
        }

        async function fetchThreadApi(targetNoteId) {
            const account = getActiveAccount();
            if (!account) return;

            const defaultHost = getInstanceHost(account);
            state.threadData.loading = true;
            renderThreadVisualizer();

            const fetchedNotesMap = new Map();

            try {
                const targetNoteRaw = await misskeyApiCall(account.instance, 'notes/show', {
                    i: account.token,
                    noteId: targetNoteId
                });

                const targetNoteParsed = cacheNoteHierarchy(targetNoteRaw, defaultHost);
                if (targetNoteParsed) fetchedNotesMap.set(targetNoteParsed.id, targetNoteParsed);

                let ancestorsRaw = [];
                try {
                    ancestorsRaw = await misskeyApiCall(account.instance, 'notes/conversation', {
                        i: account.token,
                        noteId: targetNoteId,
                        limit: 30
                    });
                } catch (e) {
                    ancestorsRaw = [];
                }

                if (Array.isArray(ancestorsRaw) && ancestorsRaw.length > 0) {
                    ancestorsRaw.forEach(raw => {
                        const p = cacheNoteHierarchy(raw, defaultHost);
                        if (p) fetchedNotesMap.set(p.id, p);
                    });
                } else {
                    let currParentId = targetNoteParsed?.replyId;
                    let depth = 0;

                    while (currParentId && depth < 12) {
                        try {
                            const parentRaw = await misskeyApiCall(account.instance, 'notes/show', {
                                i: account.token,
                                noteId: currParentId
                            });
                            const parentParsed = cacheNoteHierarchy(parentRaw, defaultHost);
                            if (parentParsed) {
                                fetchedNotesMap.set(parentParsed.id, parentParsed);
                                currParentId = parentParsed.replyId;
                            } else {
                                break;
                            }
                        } catch (err) {
                            break;
                        }
                        depth++;
                    }
                }

                try {
                    const childrenRaw = await misskeyApiCall(account.instance, 'notes/children', {
                        i: account.token,
                        noteId: targetNoteId,
                        limit: 30
                    });
                    if (Array.isArray(childrenRaw)) {
                        childrenRaw.forEach(raw => {
                            const p = cacheNoteHierarchy(raw, defaultHost);
                            if (p) fetchedNotesMap.set(p.id, p);
                        });
                    }
                } catch (e) {}

                const sortedThreadNotes = Array.from(fetchedNotesMap.values()).sort((a, b) => {
                    return new Date(a.createdAt) - new Date(b.createdAt);
                });

                state.threadData = {
                    notes: sortedThreadNotes,
                    loading: false
                };

                renderFeed();
                renderThreadVisualizer();

            } catch (err) {
                state.threadData.loading = false;
                renderThreadVisualizer();
                showToast(`타래 불러오기 실패: ${err.message}`, "error");
            }
        }

        /* ================= 답장 작성: 자동 멘션 / 이어쓰기 / 자동 분할 ================= */
        const MAX_NOTE_LEN = 3000;
        let lastAutoMention = '';
        let chainReplyTo = null;

        function buildMentionPrefix(note) {
            if (!note || !note.user) return '';
            const acc = getActiveAccount();
            if (acc && note.user.username === acc.user.username && !note.user.host) return '';
            return '@' + note.user.username + (note.user.host ? '@' + note.user.host : '') + ' ';
        }

        function applyAutoMention(note) {
            const ta = document.getElementById('replyTextInput');
            const prefix = buildMentionPrefix(note);
            const cur = ta.value;
            if (cur.trim() === '' || (lastAutoMention && cur === lastAutoMention)) {
                ta.value = prefix;
                lastAutoMention = prefix;
            } else if (lastAutoMention && cur.startsWith(lastAutoMention)) {
                ta.value = prefix + cur.slice(lastAutoMention.length);
                lastAutoMention = prefix;
            } else {
                lastAutoMention = '';
            }
            updateReplyCharCounter();
        }

        function getSelectedNote() {
            if (!state.selectedNoteId) return null;
            return noteCache.get(state.selectedNoteId) || state.mentions.find(m => m.id === state.selectedNoteId) || null;
        }

        function splitForLimit(text, limit = MAX_NOTE_LEN) {
            const chunks = [];
            let rest = text.trim();
            const minCut = Math.floor(limit * 0.5);
            while (rest.length > limit) {
                const win = rest.slice(0, limit);
                let cut = win.lastIndexOf('\n\n');
                if (cut < minCut) cut = win.lastIndexOf('\n');
                if (cut < minCut) {
                    let best = -1;
                    for (const m of win.matchAll(/[.!?。！？…]["')\]」』]*(\s|$)/g)) best = m.index + m[0].length;
                    cut = best;
                }
                if (cut < minCut) cut = win.lastIndexOf(' ');
                if (cut < minCut) {
                    cut = limit;
                    const code = rest.charCodeAt(cut - 1);
                    if (code >= 0xD800 && code <= 0xDBFF) cut -= 1;
                }
                chunks.push(rest.slice(0, cut).trim());
                rest = rest.slice(cut).trim();
            }
            if (rest) chunks.push(rest);
            return chunks.filter(Boolean);
        }

        function getReplyTexts() {
            const texts = [];
            const mainVal = document.getElementById('replyTextInput').value;
            if (mainVal.trim() && mainVal.trim() !== lastAutoMention.trim()) texts.push(mainVal.trim());
            document.querySelectorAll('#replyExtraParts textarea').forEach(t => {
                if (t.value.trim()) texts.push(t.value.trim());
            });
            return texts;
        }

        function addReplyPart(initialText) {
            const container = document.getElementById('replyExtraParts');
            const wrap = document.createElement('div');
            wrap.className = 'relative';
            wrap.innerHTML = `
                <textarea rows="3" oninput="updateReplyCharCounter()" placeholder="이어서 보낼 노트 (앞 노트에 이어 답장으로 연결돼요)" class="w-full bg-neutral-50 border border-neutral-300 rounded-md p-2.5 pr-7 text-xs text-neutral-800 placeholder-neutral-400 focus:outline-none focus:border-neutral-500 transition resize-none leading-relaxed shadow-inner"></textarea>
                <button type="button" onclick="removeReplyPart(this)" title="이 칸 삭제" class="absolute top-2 right-2 text-neutral-400 hover:text-neutral-700 text-sm leading-none p-1">×</button>
            `;
            container.appendChild(wrap);
            const ta = wrap.querySelector('textarea');
            if (typeof initialText === 'string') ta.value = initialText;
            else ta.focus();
            updateReplyCharCounter();
        }

        function removeReplyPart(btn) {
            btn.parentElement.remove();
            updateReplyCharCounter();
        }

        function clearExtraParts() {
            document.getElementById('replyExtraParts').innerHTML = '';
        }

        function setChainNotice(on) {
            const n = document.getElementById('chainNotice');
            if (!n) return;
            n.classList.toggle('hidden', !on);
            n.classList.toggle('flex', !!on);
        }

        function cancelChain() {
            chainReplyTo = null;
            setChainNotice(false);
        }

        function markSelectedReplied() {
            if (state.selectedNoteId && !state.repliedNoteIds.includes(state.selectedNoteId)) {
                state.repliedNoteIds.push(state.selectedNoteId);
                saveLocalState();
                renderFilters();
                renderFeed();
            }
        }

        async function submitReplyNote() {
            const account = getActiveAccount();
            if (!account) {
                showToast("등록된 계정이 없습니다.", "error");
                return;
            }

            if (!state.selectedNoteId) {
                showToast("답장할 대상 멘션을 먼저 선택해 주세요.", "warning");
                return;
            }

            const texts = getReplyTexts();
            if (texts.length === 0) {
                showToast("답장 내용을 입력해 주세요.", "warning");
                return;
            }

            const chunks = texts.flatMap(t => splitForLimit(t));

            const cw = state.replyForm.showCw ? document.getElementById('replyCwInput').value.trim() : "";
            const visibility = document.getElementById('replyVisibilitySelect').value;
            const localOnly = document.getElementById('replyLocalOnlyCheck').checked;
            const targetNote = noteCache.get(state.selectedNoteId);

            const sendBtn = document.getElementById('sendReplyBtn');
            sendBtn.disabled = true;

            let replyToId = chainReplyTo || state.selectedNoteId;
            let sent = 0;

            try {
                for (let i = 0; i < chunks.length; i++) {
                    const createPayload = {
                        i: account.token,
                        replyId: replyToId,
                        text: chunks[i],
                        cw: cw || undefined,
                        visibility: visibility,
                        localOnly: localOnly
                    };

                    if (visibility === 'specified' && targetNote && targetNote.visibleUserIds && targetNote.visibleUserIds.length > 0) {
                        createPayload.visibleUserIds = targetNote.visibleUserIds;
                    }

                    const res = await misskeyApiCall(account.instance, 'notes/create', createPayload);
                    sent++;

                    const createdId = res && res.createdNote && res.createdNote.id;
                    if (createdId) {
                        replyToId = createdId;
                    } else if (i < chunks.length - 1) {
                        throw new Error("생성된 노트 ID를 받지 못해 다음 노트를 이어 보낼 수 없어요");
                    }
                }

                showToast(chunks.length > 1 ? `답장 ${chunks.length}개가 이어서 전송되었습니다.` : "답장이 성공적으로 전송되었습니다.", "success");

                cancelChain();
                clearExtraParts();
                document.getElementById('replyTextInput').value = '';
                document.getElementById('replyCwInput').value = '';
                lastAutoMention = '';
                applyAutoMention(getSelectedNote());

                markSelectedReplied();
                fetchThreadApi(state.selectedNoteId);

            } catch (err) {
                if (sent > 0) {
                    const remaining = chunks.slice(sent);
                    clearExtraParts();
                    document.getElementById('replyTextInput').value = remaining[0] || '';
                    lastAutoMention = '';
                    remaining.slice(1).forEach(t => addReplyPart(t));
                    chainReplyTo = replyToId;
                    setChainNotice(true);
                    markSelectedReplied();
                    showToast(`${chunks.length}개 중 ${sent}개 전송 후 실패: ${err.message}`, "error");
                } else {
                    showToast(`전송 실패: ${err.message}`, "error");
                }
                updateReplyCharCounter();
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function addNewAccount() {
            let instance = document.getElementById('addInstanceInput').value.trim();
            const token = document.getElementById('addTokenInput').value.trim();

            if (!instance || !token) {
                showToast("인스턴스 주소와 API 토큰을 입력하세요.", "warning");
                return;
            }

            if (!/^https?:\/\//i.test(instance)) {
                instance = 'https://' + instance;
            }

            const btn = document.getElementById('addAccountBtn');
            btn.disabled = true;

            try {
                const userInfo = await misskeyApiCall(instance, 'i', { i: token });

                if (!userInfo || !userInfo.username) {
                    throw new Error("올바르지 않은 계정 응답입니다.");
                }

                const newAcc = {
                    id: 'acc-' + Date.now(),
                    instance: instance,
                    token: token,
                    user: {
                        name: userInfo.name || userInfo.username,
                        username: userInfo.username,
                        avatarUrl: userInfo.avatarUrl || 'https://placehold.co/80x80/E6E8ED/22252E?text=U'
                    }
                };

                state.accounts.push(newAcc);
                state.activeAccountId = newAcc.id;
                saveLocalState();

                showToast(`@${userInfo.username} 계정이 등록되었습니다.`, "success");
                closeModal('accountModal');

                document.getElementById('addInstanceInput').value = '';
                document.getElementById('addTokenInput').value = '';

                renderAll();
                manualFetchMentions();

            } catch (err) {
                showToast(`계정 등록 실패: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
            }
        }

        async function executeLookupNote() {
            const input = document.getElementById('lookupUrlInput').value.trim();
            const account = getActiveAccount();

            if (!input) {
                showToast("조회할 URL 또는 Note ID를 입력하세요.", "warning");
                return;
            }

            if (!account) {
                showToast("계정이 필요합니다.", "warning");
                return;
            }

            try {
                let targetNoteId = input;
                if (input.startsWith('http')) {
                    if (input.includes('/notes/')) {
                        targetNoteId = input.split('/notes/')[1].split('/')[0];
                    }
                }

                selectTargetNote(targetNoteId);
                closeModal('lookupModal');
                showToast("노트를 조회했습니다.", "success");
            } catch (err) {
                showToast(`조회 실패: ${err.message}`, "error");

        function groupMentionsByThread(mentionsList) {
            if (!state.filters.threadGrouping) {
                return mentionsList.map(m => ({ item: m, count: 1 }));
            }

            const groups = new Map();

            mentionsList.forEach(m => {
                const rootId = getRootThreadId(m.id);
                if (!groups.has(rootId)) {
                    groups.set(rootId, []);
                }
                groups.get(rootId).push(m);
            });

            const result = [];
            groups.forEach(groupItems => {
                groupItems.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                result.push({
                    item: groupItems[0],
                    count: groupItems.length
                });
            });

            result.sort((a, b) => new Date(b.item.createdAt) - new Date(a.item.createdAt));
            return result;
        }

        function renderFeed() {
            const container = document.getElementById('mentionsFeedContainer');

                if (state.filters.category === 'designated' && !isDesignatedUser(m.user)) return false;
                if (state.filters.category === 'hidden' && !state.hiddenNoteIds.includes(m.id)) return false;
                if (state.filters.category === 'unreplied' && !isUnrepliedTarget(m)) return false;
                if (state.filters.category !== 'hidden' && state.hiddenNoteIds.includes(m.id)) return false;
                if (state.filters.category !== 'hidden' && !passesDesignatedOnly(m)) return false;

                if (searchQ) {
                    const matchText = (m.text || '').toLowerCase().includes(searchQ);
                    const matchUser = (m.user.name || '').toLowerCase().includes(searchQ) || (m.user.username || '').toLowerCase().includes(searchQ);
                    const matchQuote = (m.renote?.text || '').toLowerCase().includes(searchQ);
                    if (!matchText && !matchUser && !matchQuote) return false;
                }
                return true;
            });

            const groupedList = groupMentionsByThread(baseList);

            if (groupedList.length === 0) {
                container.innerHTML = `

                                <button type="button" onclick="event.stopPropagation(); toggleRepliedNote('${m.id}')" title="${isReplied ? '답장 체크 해제' : '답장 완료로 체크'}" aria-pressed="${isReplied}" class="reply-check ${isReplied ? 'checked' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></button>

        function selectTargetNote(noteId) {
            if (state.selectedNoteId !== noteId) cancelChain();
            state.selectedNoteId = noteId;
            const found = noteCache.get(noteId) || state.mentions.find(m => m.id === noteId);

            if (found) {
                document.getElementById('replyTargetUserLabel').textContent = `@${found.user.username}@${found.user.host || ''}`;
                
                const visibilitySelect = document.getElementById('replyVisibilitySelect');
                if (visibilitySelect && found.visibility) {
                    visibilitySelect.value = found.visibility;
                }

                applyAutoMention(found);
            } else {
                document.getElementById('replyTargetUserLabel').textContent = `Note: ${noteId}`;
            }

            fetchThreadApi(noteId);
            renderFeed();

            state.mobileView = 'workspace';
            updateResponsiveViews();
        }

        function deselectTargetNote() {
            cancelChain();
            const ta = document.getElementById('replyTextInput');
            if (lastAutoMention && ta.value === lastAutoMention) ta.value = '';
            lastAutoMention = '';
            updateReplyCharCounter();
            state.selectedNoteId = null;
            state.threadData = { notes: [], loading: false };
            document.getElementById('replyTargetUserLabel').textContent = '지정 없음';

            renderThreadVisualizer();

        function updateResponsiveViews() {

                if (state.mobileView === 'list') {
                    sidePanel.classList.remove('hidden');

        function isDesignatedUser(userObj) {
            if (!userObj) return false;
            const fullHandle = `${userObj.username}@${userObj.host || ''}`.toLowerCase();
            const usernameOnly = userObj.username.toLowerCase();

            return state.designatedUsers.some(u => {
                const clean = u.toLowerCase().replace(/^@/, '').replace(/\/+$/, '');
                return clean === fullHandle || clean === usernameOnly;
            });
        }

        function toggleDesignatedUser(handle) {
            const cleanHandle = handle.toLowerCase().replace(/^@/, '');
            const index = state.designatedUsers.findIndex(u => u.toLowerCase().replace(/^@/, '').replace(/\/+$/, '') === cleanHandle);

            if (index > -1) {
                state.designatedUsers.splice(index, 1);
                showToast("지정 사용자 해제되었습니다.", "info");
            } else {
                state.designatedUsers.push(cleanHandle);
                showToast("지정 사용자 추가되었습니다.", "success");
            }

            saveLocalState();
            renderFilters();
            renderFeed();
        }

            if (!state.filters.onlyDesignated) return true;
            if (state.designatedUsers.length === 0) return true;   // 지정한 사람이 없으면 전체 표시
            return isDesignatedUser(m.user);
        }

            const chk = document.getElementById('onlyDesignatedCheck');

        function toggleHideNote(noteId) {
            if (state.hiddenNoteIds.includes(noteId)) {
                state.hiddenNoteIds = state.hiddenNoteIds.filter(id => id !== noteId);
            } else {
                state.hiddenNoteIds.push(noteId);
            }
            saveLocalState();
            renderFilters();
            renderFeed();
        }

        function isUnrepliedTarget(m) {
            if (state.hiddenNoteIds.includes(m.id)) return false;
            if (state.repliedNoteIds.includes(m.id)) return false;
            if (state.designatedUsers.length > 0 && !isDesignatedUser(m.user)) return false;
            return true;

        function toggleRepliedNote(noteId) {
            if (state.repliedNoteIds.includes(noteId)) {
                state.repliedNoteIds = state.repliedNoteIds.filter(id => id !== noteId);

                state.repliedNoteIds.push(noteId);

            renderFilters();
            renderFeed();

                        <button onclick="selectActiveAccount('${acc.id}')" class="px-2.5 py-1 rounded text-xs font-medium transition ${acc.id === state.activeAccountId ? 'btn-paper-dark' : 'btn-paper'}">
                            ${acc.id === state.activeAccountId ? '선택됨' : '선택'}
                        </button>
                        <button onclick="removeAccount('${acc.id}')" class="btn-paper px-2.5 py-1 rounded text-xs font-medium transition text-neutral-600">
                            삭제
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function selectActiveAccount(accId) {
            state.activeAccountId = accId;
            saveLocalState();
            renderAll();
            manualFetchMentions();
            closeModal('accountModal');
        }

        function removeAccount(accId) {
            state.accounts = state.accounts.filter(a => a.id !== accId);
            if (state.activeAccountId === accId) {
                state.activeAccountId = state.accounts[0]?.id || null;
            }
            saveLocalState();
            renderAll();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            toast.className = 'px-3.5 py-2 rounded-lg border-2 border-neutral-300 bg-[#F0F2F5] text-neutral-900 text-xs font-medium shadow-xl pointer-events-auto transition transform translate-y-2 opacity-0 flex items-center gap-2';
            toast.textContent = message;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 200);
            }, 2500);
        }

        function renderQuoteBlock(note, clamp) {
            if (!note || (!note.renote && !note.renoteId)) return '';
            const rn = note.renote;
            if (!rn) {
                return `<div class="quote-block quote-missing">↻ 인용한 노트 (내용을 불러오지 못했어요)</div>`;
            }
            const handle = `${rn.user.username}@${rn.user.host || ''}`;
            return `
                <div class="quote-block">
                    <div class="flex items-center gap-1.5 mb-1 min-w-0">
                        <img src="${rn.user.avatarUrl}" class="w-4 h-4 rounded-full border border-neutral-300 object-cover shrink-0">
                        <span class="text-[11px] font-semibold text-neutral-800 truncate">${escapeHtml(rn.user.name)}</span>
                        <span class="card-handle truncate">@${escapeHtml(handle)}</span>
                    </div>
                    ${rn.cw ? `<div class="mb-1 text-[11px] font-medium text-neutral-700">CW: ${escapeHtml(rn.cw)}</div>` : ''}
                    ${rn.text ? `<p class="quote-text break-words ${clamp ? 'preview-clamp-2' : 'whitespace-pre-wrap'}">${renderNoteText(rn.text)}</p>` : ''}
                    ${rn.fileCount ? `<span class="text-[10px] text-neutral-500">첨부 ${rn.fileCount}개</span>` : ''}
                </div>
            `;
        }

        function renderNoteText(text) {
            return escapeHtml(text || '').replace(/(^|[\s(（「])(@[A-Za-z0-9_]+(?:@[A-Za-z0-9._-]*[A-Za-z0-9])?)/g, '$1<span class="mention-tag">$2</span>');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatRelativeTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const now = new Date();
            const diffSec = Math.floor((now - date) / 1000);

            if (diffSec < 60) return '방금 전';
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)}분 전`;
            if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}시간 전`;
            return `${Math.floor(diffSec / 86400)}일 전`;
        }
    </script>
</body>
</html>
