        async function misskeyApiCall(instanceUrl, endpoint, body = {}) {
            const cleanUrl = instanceUrl.replace(/\/+$/, '');
            const targetUrl = `${cleanUrl}/api/${endpoint.replace(/^\//, '')}`;
            
            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API 오류 (${response.status}): ${errText}`);
            }
            return await response.json();
        }

        function cacheNoteHierarchy(rawNote, defaultHost = '') {
            if (!rawNote || !rawNote.id) return null;

            const parsed = {
                id: rawNote.id,
                user: {
                    name: rawNote.user?.name || rawNote.user?.username || '알 수 없음',
                    username: rawNote.user?.username || 'unknown',
                    host: rawNote.user?.host || defaultHost,
                    avatarUrl: rawNote.user?.avatarUrl || 'https://placehold.co/80x80/E6E8ED/22252E?text=U'
                },
                text: rawNote.text || '',
                cw: rawNote.cw || null,
                createdAt: rawNote.createdAt,
                visibility: rawNote.visibility || 'public',
                visibleUserIds: rawNote.visibleUserIds || [],
                replyId: rawNote.replyId || null,
                renoteId: rawNote.renoteId || null,
                renote: rawNote.renote ? {
                    id: rawNote.renote.id,
                    user: {
                        name: rawNote.renote.user?.name || rawNote.renote.user?.username || '알 수 없음',
                        username: rawNote.renote.user?.username || 'unknown',
                        host: rawNote.renote.user?.host || defaultHost,
                        avatarUrl: rawNote.renote.user?.avatarUrl || 'https://placehold.co/80x80/F0F2F5/22252E?text=U'
                    },
                    text: rawNote.renote.text || '',
                    cw: rawNote.renote.cw || null,
                    createdAt: rawNote.renote.createdAt,
                    fileCount: Array.isArray(rawNote.renote.files) ? rawNote.renote.files.length : 0
                } : null
            };

            noteCache.set(parsed.id, parsed);

            if (rawNote.reply) {
                parentCache.set(parsed.id, rawNote.reply.id);
                cacheNoteHierarchy(rawNote.reply, defaultHost);
            } else if (parsed.replyId) {
                parentCache.set(parsed.id, parsed.replyId);
            }

            return parsed;
        }

        function getRootThreadId(noteId) {
            let currentId = noteId;
            const visited = new Set();

            while (currentId && !visited.has(currentId)) {
                visited.add(currentId);
                const parentId = parentCache.get(currentId);
                if (!parentId) break;
                currentId = parentId;
            }

            return currentId || noteId;
        }

        function mergeNotes(newParsedNotes) {
            const existingMap = new Map(state.mentions.map(m => [m.id, m]));
            newParsedNotes.forEach(n => existingMap.set(n.id, n));

            state.mentions = Array.from(existingMap.values()).sort((a, b) => {
                return new Date(b.createdAt) - new Date(a.createdAt);
            });
        }

        const MENTION_CACHE_KEY = 'MISSKEY_MW_MENTION_CACHE';
        function saveMentionCache() {
            try {
                const acc = getActiveAccount();
                if (!acc) return;
                localStorage.setItem(MENTION_CACHE_KEY, JSON.stringify({ accountId: acc.id, notes: state.mentions.slice(0, 40) }));
            } catch (e) {}
        }
        // 지난번에 받아둔 멘션을 먼저 보여주고, 새 데이터는 뒤에서 받아 갱신
        function loadMentionCache() {
            try {
                const raw = localStorage.getItem(MENTION_CACHE_KEY);
                if (!raw) return;
                const c = JSON.parse(raw);
                const acc = getActiveAccount();
                if (!acc || c.accountId !== acc.id || !Array.isArray(c.notes)) return;
                c.notes.forEach(n => { noteCache.set(n.id, n); if (n.replyId) parentCache.set(n.id, n.replyId); });
                state.mentions = c.notes;
            } catch (e) {}
        }

        async function fetchMentionsApi(untilId = null) {
            const account = getActiveAccount();
            if (!account) return;

            const defaultHost = getInstanceHost(account);
            const payload = { i: account.token, limit: 30 };
            if (untilId) payload.untilId = untilId;

            // 멘션과 인용 알림을 동시에 요청 (순서대로 기다리지 않음)
            const [result, quoteList] = await Promise.all([
                misskeyApiCall(account.instance, 'notes/mentions', payload),
                fetchQuoteNotes(account, defaultHost, !!untilId)   // 인용 노트는 notes/mentions에 안 잡혀서 따로 가져옴
            ]);

            let parsedList = [];
            if (Array.isArray(result)) {
                parsedList = result.map(raw => cacheNoteHierarchy(raw, defaultHost));
            }

            if (parsedList.length > 0 || quoteList.length > 0) {
                mergeNotes(parsedList.concat(quoteList));
                renderFeed();
                renderFilters();
                saveMentionCache();
            }

            // 최신 목록을 받았을 때만: 서버에서 사라진(삭제된) 멘션을 목록에서 정리
            if (!untilId && Array.isArray(result)) {
                const returnedIds = new Set(parsedList.concat(quoteList).map(n => n.id));
                const oldest = parsedList.length ? parsedList[parsedList.length - 1].createdAt : null;
                pruneDeletedMentions(account, returnedIds, parsedList.length >= 30 ? oldest : null).catch(() => {});
            }
        }

        // 이번 목록에 없는 멘션이 실제로 삭제됐는지 notes/show로 확인한 뒤 지움
        // (확인된 노트는 10분간 다시 확인하지 않음 / 한 번에 최대 12개)
        const existChecked = new Map();
        async function pruneDeletedMentions(account, returnedIds, oldestCreatedAt) {
            const now = Date.now();
            let cands = state.mentions.filter(m => !returnedIds.has(m.id));
            if (oldestCreatedAt) {
                const limit = new Date(oldestCreatedAt).getTime();
                cands = cands.filter(m => new Date(m.createdAt).getTime() >= limit);
            }
            cands = cands.filter(m => (existChecked.get(m.id) || 0) < now - 600000).slice(0, 12);
            if (cands.length === 0) return;

            const gone = [];
            await Promise.all(cands.map(async m => {
                try {
                    await misskeyApiCall(account.instance, 'notes/show', { i: account.token, noteId: m.id });
                    existChecked.set(m.id, now);
                } catch (err) {
                    if (/NO_SUCH_NOTE|\(404\)/.test(String(err && err.message))) gone.push(m.id);
                }
            }));

            const cur = getActiveAccount();
            if (gone.length === 0 || !cur || cur.id !== account.id) return;
            const goneSet = new Set(gone);
            state.mentions = state.mentions.filter(m => !goneSet.has(m.id));
            gone.forEach(id => { noteCache.delete(id); existChecked.delete(id); });
            renderFeed();
            renderFilters();
            saveMentionCache();
        }

        let quoteCursor = null;      // 인용 알림 페이지네이션 커서 (알림 id)
        let quoteWarned = false;

        async function fetchQuoteNotes(account, defaultHost, older) {
            try {
                const payload = {
                    i: account.token,
                    limit: 30,
                    includeTypes: ['quote'],
                    markAsRead: false   // 불러오기만 하고 읽음 처리는 하지 않음
                };
                if (older && quoteCursor) payload.untilId = quoteCursor;

                const res = await misskeyApiCall(account.instance, 'i/notifications', payload);
                if (!Array.isArray(res) || res.length === 0) return [];

                const oldest = res[res.length - 1]?.id;
                if (oldest && (older || !quoteCursor)) quoteCursor = oldest;

                return res
                    .filter(n => n && n.note)
                    .map(n => cacheNoteHierarchy(n.note, defaultHost))
                    .filter(Boolean);
            } catch (err) {
                if (!quoteWarned) {
                    quoteWarned = true;
                    showToast("인용 노트를 불러오지 못했어요. 토큰에 '알림 읽기(read:notifications)' 권한이 있는지 확인해 주세요.", "warning");
                }
                console.warn("인용 알림 로드 실패:", err);
                return [];
            }
        }

        async function manualFetchMentions() {
            const account = getActiveAccount();
            if (!account) {
                showToast("등록된 계정이 없습니다.", "warning");
                return;
            }
            if (state.filters.category === 'antenna') {
                try {
                    await ensureAntennas();
                    await fetchAntennaNotes(false);
                    showToast("안테나 노트를 새로고침했습니다.", "success");
                } catch (err) {
                    showToast(`새로고침 실패: ${err.message}`, "error");
                }
                return;
            }
            try {
                await fetchMentionsApi(null);
                showToast("멘션 목록을 새로고침했습니다.", "success");
            } catch (err) {
                showToast(`새로고침 실패: ${err.message}`, "error");
            }
        }

        async function fetchOlderMentions() {
            const antennaMode = state.filters.category === 'antenna';
            const list = antennaMode ? state.antennaNotes : state.mentions;
            if (list.length === 0) return manualFetchMentions();

            const oldestId = list[list.length - 1].id;
            const btn = document.getElementById('loadOlderBtn');
            btn.disabled = true;

            try {
                if (antennaMode) await fetchAntennaNotes(true);
                else await fetchMentionsApi(oldestId);
                showToast("이전 멘션을 불러왔습니다.", "success");
            } catch (err) {
                showToast(`불러오기 실패: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
            }
        }

        async function silentFetchMentions() {
            const account = getActiveAccount();
            if (!account) return;
            try {
                await fetchMentionsApi(null);
                if (state.filters.category === 'antenna' && state.antennaId) await fetchAntennaNotes(false);
            } catch (e) {}
        }

        async function fetchThreadApi(targetNoteId) {
            const account = getActiveAccount();
            if (!account) return;

            const defaultHost = getInstanceHost(account);
            state.threadData.loading = true;
            renderThreadVisualizer();

            const fetchedNotesMap = new Map();

            try {
                const targetNoteRaw = await misskeyApiCall(account.instance, 'notes/show', {
                    i: account.token,
                    noteId: targetNoteId
                });

                const targetNoteParsed = cacheNoteHierarchy(targetNoteRaw, defaultHost);
                if (targetNoteParsed) fetchedNotesMap.set(targetNoteParsed.id, targetNoteParsed);

                let ancestorsRaw = [];
                try {
                    ancestorsRaw = await misskeyApiCall(account.instance, 'notes/conversation', {
                        i: account.token,
                        noteId: targetNoteId,
                        limit: 30
                    });
                } catch (e) {
                    ancestorsRaw = [];
                }

                if (Array.isArray(ancestorsRaw) && ancestorsRaw.length > 0) {
                    ancestorsRaw.forEach(raw => {
                        const p = cacheNoteHierarchy(raw, defaultHost);
                        if (p) fetchedNotesMap.set(p.id, p);
                    });
                } else {
                    let currParentId = targetNoteParsed?.replyId;
                    let depth = 0;

                    while (currParentId && depth < 12) {
                        try {
                            const parentRaw = await misskeyApiCall(account.instance, 'notes/show', {
                                i: account.token,
                                noteId: currParentId
                            });
                            const parentParsed = cacheNoteHierarchy(parentRaw, defaultHost);
                            if (parentParsed) {
                                fetchedNotesMap.set(parentParsed.id, parentParsed);
                                currParentId = parentParsed.replyId;
                            } else {
                                break;
                            }
                        } catch (err) {
                            break;
                        }
                        depth++;
                    }
                }

                try {
                    const childrenRaw = await misskeyApiCall(account.instance, 'notes/children', {
                        i: account.token,
                        noteId: targetNoteId,
                        limit: 30
                    });
                    if (Array.isArray(childrenRaw)) {
                        childrenRaw.forEach(raw => {
                            const p = cacheNoteHierarchy(raw, defaultHost);
                            if (p) fetchedNotesMap.set(p.id, p);
                        });
                    }
                } catch (e) {}

                const sortedThreadNotes = Array.from(fetchedNotesMap.values()).sort((a, b) => {
                    return new Date(a.createdAt) - new Date(b.createdAt);
                });

                state.threadData = {
                    notes: sortedThreadNotes,
                    loading: false
                };

                renderFeed();
                renderThreadVisualizer();

            } catch (err) {
                state.threadData.loading = false;
                renderThreadVisualizer();
                showToast(`타래 불러오기 실패: ${err.message}`, "error");
            }
        }

        /* ================= 답장 작성: 자동 멘션 / 이어쓰기 / 자동 분할 ================= */
        const MAX_NOTE_LEN = 3000;
        let lastAutoMention = '';
        let lastAutoCw = '';
        let chainReplyTo = null;

        function buildMentionPrefix(note) {
            if (!note || !note.user) return '';
            const acc = getActiveAccount();
            if (acc && note.user.username === acc.user.username && !note.user.host) return '';
            return '@' + note.user.username + (note.user.host ? '@' + note.user.host : '') + ' ';
        }

        function applyAutoMention(note) {
            const ta = document.getElementById('replyTextInput');
            const prefix = buildMentionPrefix(note);
            const oldAuto = lastAutoMention;
            document.querySelectorAll('#replyExtraParts textarea').forEach(t => {
                if (oldAuto && t.value === oldAuto) t.value = prefix;
            });
            const cur = ta.value;
            if (cur.trim() === '' || (lastAutoMention && cur === lastAutoMention)) {
                ta.value = prefix;
                lastAutoMention = prefix;
            } else if (lastAutoMention && cur.startsWith(lastAutoMention)) {
                ta.value = prefix + cur.slice(lastAutoMention.length);
                lastAutoMention = prefix;
            } else {
                lastAutoMention = '';
            }
            updateReplyCharCounter();
        }

        function setCwVisible(on) {
            state.replyForm.showCw = on;
            document.getElementById('cwInputContainer').classList.toggle('hidden', !on);
        }

        // CW가 걸린 멘션에 답할 때 같은 CW를 자동으로 이어받음
        function applyAutoCw(note) {
            const inp = document.getElementById('replyCwInput');
            const want = (note && note.cw) || '';
            if (want) {
                if (inp.value.trim() === '' || inp.value === lastAutoCw) inp.value = want;
                lastAutoCw = want;
                setCwVisible(true);
            } else {
                if (lastAutoCw && inp.value === lastAutoCw) { inp.value = ''; setCwVisible(false); }
                lastAutoCw = '';
            }
        }

        function getSelectedNote() {
            if (!state.selectedNoteId) return null;
            return noteCache.get(state.selectedNoteId) || state.mentions.find(m => m.id === state.selectedNoteId) || null;
        }

        function splitForLimit(text, limit = MAX_NOTE_LEN) {
            const chunks = [];
            let rest = text.trim();
            const minCut = Math.floor(limit * 0.5);
            while (rest.length > limit) {
                const win = rest.slice(0, limit);
                let cut = win.lastIndexOf('\n\n');
                if (cut < minCut) cut = win.lastIndexOf('\n');
                if (cut < minCut) {
                    let best = -1;
                    for (const m of win.matchAll(/[.!?。！？…]["')\]」』]*(\s|$)/g)) best = m.index + m[0].length;
                    cut = best;
                }
                if (cut < minCut) cut = win.lastIndexOf(' ');
                if (cut < minCut) {
                    cut = limit;
                    const code = rest.charCodeAt(cut - 1);
                    if (code >= 0xD800 && code <= 0xDBFF) cut -= 1;
                }
                chunks.push(rest.slice(0, cut).trim());
                rest = rest.slice(cut).trim();
            }
            if (rest) chunks.push(rest);
            return chunks.filter(Boolean);
        }

        function getReplyTexts() {
            const texts = [];
            const mainVal = document.getElementById('replyTextInput').value;
            if (mainVal.trim() && mainVal.trim() !== lastAutoMention.trim()) texts.push(mainVal.trim());
            document.querySelectorAll('#replyExtraParts textarea').forEach(t => {
                if (isRealText(t.value)) texts.push(t.value.trim());
            });
            return texts;
        }

        /* ---- 이어쓰기 칸: 번호 탭(1 2 3)으로 전환 ---- */
        let activePart = 0;
        function partTextareas() {
            return [document.getElementById('replyTextInput'), ...document.querySelectorAll('#replyExtraParts textarea')];
        }
        function showPart(i) {
            const tas = partTextareas();
            activePart = Math.max(0, Math.min(i, tas.length - 1));
            tas.forEach((t, k) => {
                const holder = k === 0 ? t : t.parentElement;
                holder.style.display = k === activePart ? '' : 'none';
            });
            renderPartTabs();
        }
        function renderPartTabs() {
            const bar = document.getElementById('partTabs');
            if (!bar) return;
            const n = partTextareas().length;
            bar.classList.toggle('hidden', n < 2);
            bar.classList.toggle('flex', n >= 2);
            bar.innerHTML = n < 2 ? '' : Array.from({ length: n }, (_, k) =>
                `<button type="button" onclick="showPart(${k})" class="${k === activePart ? 'btn-paper-dark' : 'btn-paper'} px-2 rounded-md text-xs font-medium">${k + 1}</button>`
            ).join('');
        }

        // 이어쓰기 칸에 자동으로 넣는 답장 대상 아이디 (내 계정이면 빈 값)
        function extraPrefix() { return buildMentionPrefix(getSelectedNote()); }
        function isRealText(v) { return v.trim() && v.trim() !== extraPrefix().trim(); }

        function addReplyPart(initialText) {
            const container = document.getElementById('replyExtraParts');
            const wrap = document.createElement('div');
            wrap.className = 'relative';
            wrap.innerHTML = `
                <textarea rows="3" oninput="updateReplyCharCounter()" class="w-full bg-neutral-50 border border-neutral-300 rounded-md p-2.5 pr-7 text-xs text-neutral-800 placeholder-neutral-400 focus:outline-none focus:border-neutral-500 transition resize-none leading-relaxed shadow-inner"></textarea>
                <button type="button" onclick="removeReplyPart(this)" class="absolute top-2 right-2 text-neutral-400 hover:text-neutral-700 leading-none p-1"><i data-lucide="x" class="w-3 h-3"></i></button>
            `;
            container.appendChild(wrap);
            lucide.createIcons();
            const ta = wrap.querySelector('textarea');
            if (typeof initialText === 'string') ta.value = initialText;
            else ta.value = extraPrefix();
            showPart(partTextareas().length - 1);
            if (typeof initialText !== 'string') { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
            updateReplyCharCounter();
        }

        function removeReplyPart(btn) {
            btn.parentElement.remove();
            showPart(Math.max(0, activePart - 1));
            updateReplyCharCounter();
        }

        function clearExtraParts() {
            document.getElementById('replyExtraParts').innerHTML = '';
            showPart(0);
        }

        function setChainNotice(on) {
            const n = document.getElementById('chainNotice');
            if (!n) return;
            n.classList.toggle('hidden', !on);
            n.classList.toggle('flex', !!on);
        }

        function cancelChain() {
            chainReplyTo = null;
            setChainNotice(false);
        }

        function markSelectedReplied() {
            if (state.selectedNoteId && !state.repliedNoteIds.includes(state.selectedNoteId)) {
                state.repliedNoteIds.push(state.selectedNoteId);
                saveLocalState();
                renderFilters();
                renderFeed();
            }
        }

        async function submitReplyNote() {
            const account = getActiveAccount();
            if (!account) {
                showToast("등록된 계정이 없습니다.", "error");
                return;
            }

            if (!state.selectedNoteId) {
                showToast("답장할 대상 멘션을 먼저 선택해 주세요.", "warning");
                return;
            }

            const texts = getReplyTexts();
            if (texts.length === 0) {
                showToast("답장 내용을 입력해 주세요.", "warning");
                return;
            }

            const chunks = texts.flatMap(t => splitForLimit(t));

            const cw = state.replyForm.showCw ? document.getElementById('replyCwInput').value.trim() : "";
            const visibility = document.getElementById('replyVisibilitySelect').value;
            const localOnly = false;
            const targetNote = noteCache.get(state.selectedNoteId);

            const sendBtn = document.getElementById('sendReplyBtn');
            sendBtn.disabled = true;

            let replyToId = chainReplyTo || state.selectedNoteId;
            let sent = 0;

            try {
                for (let i = 0; i < chunks.length; i++) {
                    const createPayload = {
                        i: account.token,
                        replyId: replyToId,
                        text: chunks[i],
                        cw: cw || undefined,
                        visibility: visibility,
                        localOnly: localOnly
                    };

                    if (visibility === 'specified' && targetNote && targetNote.visibleUserIds && targetNote.visibleUserIds.length > 0) {
                        createPayload.visibleUserIds = targetNote.visibleUserIds;
                    }

                    const res = await misskeyApiCall(account.instance, 'notes/create', createPayload);
                    sent++;

                    const createdId = res && res.createdNote && res.createdNote.id;
                    if (createdId) {
                        replyToId = createdId;
                    } else if (i < chunks.length - 1) {
                        throw new Error("생성된 노트 ID를 받지 못해 다음 노트를 이어 보낼 수 없어요");
                    }
                }

                showToast(chunks.length > 1 ? `답장 ${chunks.length}개가 이어서 전송되었습니다.` : "답장이 성공적으로 전송되었습니다.", "success");

                cancelChain();
                clearExtraParts();
                document.getElementById('replyTextInput').value = '';
                document.getElementById('replyCwInput').value = '';
                lastAutoMention = '';
                lastAutoCw = '';
                applyAutoMention(getSelectedNote());
                applyAutoCw(getSelectedNote());

                findDraftKeys(state.selectedNoteId).forEach(k => delete state.drafts[k]);
                markSelectedReplied();
                fetchThreadApi(state.selectedNoteId);

            } catch (err) {
                if (sent > 0) {
                    const remaining = chunks.slice(sent);
                    clearExtraParts();
                    document.getElementById('replyTextInput').value = remaining[0] || '';
                    lastAutoMention = '';
                    remaining.slice(1).forEach(t => addReplyPart(t));
                    showPart(0);
                    chainReplyTo = replyToId;
                    setChainNotice(true);
                    markSelectedReplied();
                    showToast(`${chunks.length}개 중 ${sent}개 전송 후 실패: ${err.message}`, "error");
                } else {
                    showToast(`전송 실패: ${err.message}`, "error");
                }
                updateReplyCharCounter();
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function addNewAccount() {
            let instance = document.getElementById('addInstanceInput').value.trim();
            const token = document.getElementById('addTokenInput').value.trim();

            if (!instance || !token) {
                showToast("인스턴스 주소와 API 토큰을 입력하세요.", "warning");
                return;
            }

            if (!/^https?:\/\//i.test(instance)) {
                instance = 'https://' + instance;
            }

            const btn = document.getElementById('addAccountBtn');
            btn.disabled = true;

            try {
                const userInfo = await misskeyApiCall(instance, 'i', { i: token });

                if (!userInfo || !userInfo.username) {
                    throw new Error("올바르지 않은 계정 응답입니다.");
                }

                const newAcc = {
                    id: 'acc-' + Date.now(),
                    instance: instance,
                    token: token,
                    user: {
                        name: userInfo.name || userInfo.username,
                        username: userInfo.username,
                        avatarUrl: userInfo.avatarUrl || 'https://placehold.co/80x80/E6E8ED/22252E?text=U'
                    }
                };

                state.accounts.push(newAcc);
                state.activeAccountId = newAcc.id;
                saveLocalState();

                showToast(`@${userInfo.username} 계정이 등록되었습니다.`, "success");
                closeModal('accountModal');

                document.getElementById('addInstanceInput').value = '';
                document.getElementById('addTokenInput').value = '';

                renderAll();
                manualFetchMentions();

            } catch (err) {
                showToast(`계정 등록 실패: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
            }
        }

        async function executeLookupNote() {
            const input = document.getElementById('lookupUrlInput').value.trim();
            const account = getActiveAccount();

            if (!input) {
                showToast("조회할 URL 또는 Note ID를 입력하세요.", "warning");
                return;
            }

            if (!account) {
                showToast("계정이 필요합니다.", "warning");
                return;
            }

            try {
                let targetNoteId = input;
                if (input.startsWith('http')) {
                    if (input.includes('/notes/')) {
                        targetNoteId = input.split('/notes/')[1].split('/')[0];
                    }
                }

                selectTargetNote(targetNoteId);
                closeModal('lookupModal');
                showToast("노트를 조회했습니다.", "success");
            } catch (err) {
                showToast(`조회 실패: ${err.message}`, "error");
            }
        }

        function renderAll() {
            renderHeader();
            renderFilters();
            renderFeed();
            renderThreadVisualizer();
            renderModalAccountList();
            updateFontSizeUI();
            updateResponsiveViews();
            updateVisibilityBtn();
            lucide.createIcons();
        }

        function renderHeader() {
            const acc = getActiveAccount();
            const label = document.getElementById('activeAccountLabel');
            if (acc) {
                label.textContent = `@${acc.user.username}`;
            } else {
                label.textContent = '계정 연결';
            }
            const ml = document.getElementById('menuAccountLabel');
            if (ml) ml.textContent = acc ? `계정 @${acc.user.username}` : '계정 연결';
        }

        function renderFilters() {
            const designatedCount = state.mentions.filter(m => isDesignatedUser(m.user)).length;
            const unrepliedCount = state.mentions.filter(isUnrepliedTarget).length;

            document.getElementById('countBadge-designated').textContent = designatedCount;
            document.getElementById('countBadge-unreplied').textContent = unrepliedCount;

            ['all', 'designated', 'unreplied', 'hidden', 'antenna'].forEach(cat => {
                const btn = document.getElementById(`filterTab-${cat}`);
                if (btn) {
                    const isIcon = (cat !== 'all');
                    const pad = isIcon ? 'px-2 py-1 inline-flex items-center gap-1' : 'px-2.5 py-1 text-xs font-medium';

                        : `btn-paper ${pad} rounded-md text-neutral-700 transition`;
                }
            });

            const toggleBtn = document.getElementById('threadGroupToggleBtn');
            if (toggleBtn) {
                toggleBtn.title = state.filters.threadGrouping ? '타래 묶기 켜짐 (누르면 끔)' : '타래 묶기 꺼짐 (누르면 켬)';
                toggleBtn.className = state.filters.threadGrouping
                    ? 'btn-paper-dark px-2 py-1 rounded-md transition'
                    : 'btn-paper px-2 py-1 rounded-md text-neutral-700 transition';
            }
        }

        function setCategoryFilter(cat) {
            state.filters.category = cat;
            renderFilters();
            renderAntennaBar();
            renderFeed();
            if (cat === 'antenna') openAntennaTab();
        }

        /* ================= 안테나 탭 ================= */
        const ANTENNA_KEY = 'MISSKEY_MW_ANTENNA';
        state.antennas = [];
        state.antennaNotes = [];
        state.antennaId = localStorage.getItem(ANTENNA_KEY) || null;
        state.antennaAccountId = null;
        state.antennaLoaded = false;

        function renderAntennaBar() {
            const bar = document.getElementById('antennaBar');
            if (!bar) return;
            const on = state.filters.category === 'antenna';
            bar.classList.toggle('hidden', !on);
            bar.classList.toggle('flex', on);
            if (!on) return;
            if (state.antennas.length === 0) {
                bar.innerHTML = `<span class="text-[11px] text-neutral-500">${state.antennaLoaded ? '안테나가 없어요' : '불러오는 중...'}</span>`;
                return;
            }
            const btn = (id, label, title) => `<button onclick="setAntenna('${id}')" class="${state.antennaId === id ? 'btn-paper-dark' : 'btn-paper'} px-2 py-1 rounded-md text-[11px] font-medium">${escapeHtml(label)}</button>`;
            const all = state.antennas.length > 1 ? btn('ALL', '전체 안테나', '모든 안테나를 합쳐서 보기') : '';
            bar.innerHTML = all + state.antennas.map(a => btn(a.id, shortName(a.name || '안테나', 8), a.name || '')).join('');
        }

        async function ensureAntennas() {
            const account = getActiveAccount();
            if (!account) return;
            if (state.antennaAccountId !== account.id) {
                state.antennaAccountId = account.id;
                state.antennas = []; state.antennaNotes = []; state.antennaCursor = {}; state.antennaLoaded = false;
            }
            if (state.antennaLoaded) return;
            try {
                const list = await misskeyApiCall(account.instance, 'antennas/list', { i: account.token });
                state.antennas = Array.isArray(list) ? list : [];
                state.antennaLoaded = true;
            } catch (err) {
                state.antennas = [];
                showToast("안테나 목록을 불러오지 못했어요. 토큰에 '계정 정보 읽기(read:account)' 권한이 있는지 확인해 주세요.", "warning");
                console.warn('antennas/list 실패:', err);
            }
            if (state.antennaId !== 'ALL' && !state.antennas.find(a => a.id === state.antennaId)) {
                state.antennaId = state.antennas.length > 1 ? 'ALL' : (state.antennas[0] ? state.antennas[0].id : null);
            }
            if (state.antennaId === 'ALL' && state.antennas.length === 1) state.antennaId = state.antennas[0].id;
            renderAntennaBar();
        }

        async function openAntennaTab() {
            await ensureAntennas();
            if (state.filters.category !== 'antenna') return;
            if (state.antennaId && state.antennaNotes.length === 0) {
                try { await fetchAntennaNotes(false); } catch (err) { showToast(`안테나 불러오기 실패: ${err.message}`, "error"); }
            }
            renderFeed();
        }

        function setAntenna(id) {
            state.antennaId = id || null;
            if (id) localStorage.setItem(ANTENNA_KEY, id);
            state.antennaNotes = [];
            state.antennaCursor = {};
            renderAntennaBar();
            renderFeed();
            if (id) fetchAntennaNotes(false).catch(err => showToast(`안테나 불러오기 실패: ${err.message}`, "error"));
        }

        state.antennaCursor = {};   // 안테나별로 가장 오래된 노트 id (이전 노트 불러오기용)

        async function fetchAntennaNotes(older) {
            const account = getActiveAccount();
            if (!account || !state.antennaId) return;
            const requestedId = state.antennaId;
            const targets = requestedId === 'ALL' ? state.antennas.map(a => a.id) : [requestedId];
            const defaultHost = getInstanceHost(account);

            const results = await Promise.all(targets.map(async aid => {
                const payload = { i: account.token, antennaId: aid, limit: 30 };
                if (older && state.antennaCursor[aid]) payload.untilId = state.antennaCursor[aid];
                try {
                    const res = await misskeyApiCall(account.instance, 'antennas/notes', payload);
                    return { aid, res: Array.isArray(res) ? res : [] };
                } catch (err) {
                    console.warn('antennas/notes 실패:', err);
                    return { aid, res: null, err };
                }
            }));
            if (requestedId !== state.antennaId) return;   // 그 사이 다른 안테나로 바꿨으면 버림

            if (results.every(r => r.res === null)) throw results[0].err;

            const map = new Map(state.antennaNotes.map(n => [n.id, n]));
            results.forEach(({ aid, res }) => {
                if (!res) return;
                res.forEach(raw => { const n = cacheNoteHierarchy(raw, defaultHost); if (n) map.set(n.id, n); });
                if (res.length && (older || !state.antennaCursor[aid])) state.antennaCursor[aid] = res[res.length - 1].id;
            });
            state.antennaNotes = Array.from(map.values()).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            renderFeed();
        }

        function toggleThreadGrouping() {
            state.filters.threadGrouping = !state.filters.threadGrouping;
            saveLocalState();
            renderFilters();
            renderFeed();
        }

        function groupMentionsByThread(mentionsList) {
            if (!state.filters.threadGrouping) {
                return mentionsList.map(m => ({ item: m, count: 1 }));
            }

            const groups = new Map();

            mentionsList.forEach(m => {
                const rootId = getRootThreadId(m.id);
                if (!groups.has(rootId)) {
                    groups.set(rootId, []);
                }
                groups.get(rootId).push(m);
            });

            const result = [];
            groups.forEach(groupItems => {
                groupItems.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                result.push({
                    item: groupItems[0],
                    count: groupItems.length
                });
            });

            result.sort((a, b) => new Date(b.item.createdAt) - new Date(a.item.createdAt));
            return result;
        }

        function matchesSearch(m, q) {
            if (!q) return true;
            return (m.text || '').toLowerCase().includes(q)
                || (m.user.name || '').toLowerCase().includes(q)
                || (m.user.username || '').toLowerCase().includes(q)
                || (m.renote?.text || '').toLowerCase().includes(q);
        }

        function renderFeed() {
            const container = document.getElementById('mentionsFeedContainer');
            const searchQ = state.filters.searchQuery.toLowerCase();

            const isAntenna = state.filters.category === 'antenna';
            let baseList = (isAntenna ? state.antennaNotes : state.mentions).filter(m => {
                if (isAntenna) return !state.hiddenNoteIds.includes(m.id) && matchesSearch(m, searchQ);
                if (state.filters.category === 'designated' && !isDesignatedUser(m.user)) return false;
                if (state.filters.category === 'hidden' && !state.hiddenNoteIds.includes(m.id)) return false;
                if (state.filters.category === 'unreplied' && !isUnrepliedTarget(m)) return false;
                if (state.filters.category !== 'hidden' && state.hiddenNoteIds.includes(m.id)) return false;
                if (state.filters.category !== 'hidden' && !passesDesignatedOnly(m)) return false;

                if (searchQ) {
                    const matchText = (m.text || '').toLowerCase().includes(searchQ);
                    const matchUser = (m.user.name || '').toLowerCase().includes(searchQ) || (m.user.username || '').toLowerCase().includes(searchQ);
                    const matchQuote = (m.renote?.text || '').toLowerCase().includes(searchQ);
                    if (!matchText && !matchUser && !matchQuote) return false;
                }
                return true;
            });

            const groupedList = isAntenna ? baseList.map(m => ({ item: m, count: 1 })) : groupMentionsByThread(baseList);

            if (groupedList.length === 0) {
                container.innerHTML = `
                    <div class="h-36 flex flex-col items-center justify-center text-xs text-neutral-400 font-medium border border-dashed border-neutral-300 rounded-lg p-4 text-center bg-neutral-100/30">
                        <i data-lucide="inbox" class="w-6 h-6 mb-1.5 opacity-40"></i>
                        <span>${isAntenna ? (state.antennaLoaded && state.antennas.length === 0 ? '안테나가 없어요. 미스키에서 안테나를 먼저 만들어 주세요.' : '안테나에 모인 노트가 없습니다.') : '수신된 멘션 항목이 없습니다.'}</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = groupedList.map(({ item: m, count }) => {
                const isSelected = state.selectedNoteId === m.id;
                const isDesignated = isDesignatedUser(m.user);
                const isReplied = state.repliedNoteIds.includes(m.id);
                const fullHandle = `${m.user.username}@${m.user.host || ''}`;

                return `
                    <div onclick="selectTargetNote('${m.id}')" class="mention-card p-3 cursor-pointer ${isSelected ? 'selected-card' : ''} ${isReplied ? 'opacity-65' : ''}">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <div class="flex items-center gap-2 min-w-0">
                                <img src="${m.user.avatarUrl}" class="w-6 h-6 rounded-full border border-neutral-300 object-cover shrink-0">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-1.5">
                                        <span class="card-name truncate">${wrapEmoji(escapeHtml(shortName(cleanName(m.user.name, m.user.username))))}</span>
                                        ${count > 1 ? `<span class="count-dot shrink-0">${count}</span>` : ''}
                                    </div>
                                    <span class="card-handle block truncate">@${escapeHtml(fullHandle)}</span>
                                </div>
                            </div>

                            <div class="flex items-center gap-1.5 shrink-0">
                                ${hasDraftForNote(m.id) ? `<i data-lucide="save" class="w-3 h-3 text-neutral-500"></i>` : ''}
                                <span class="text-[11px] font-normal text-neutral-400">${formatRelativeTime(m.createdAt)}</span>
                                <button type="button" onclick="event.stopPropagation(); toggleRepliedNote('${m.id}')" aria-pressed="${isReplied}" class="reply-check ${isReplied ? 'checked' : ''}"><i data-lucide="check" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        ${m.cw ? `
                            <div class="mb-2 p-1.5 rounded border border-neutral-400 text-[11px] font-medium bg-neutral-100 text-neutral-800">
                                CW: ${escapeHtml(m.cw)}
                            </div>
                        ` : ''}

                        ${m.text ? `<p class="preview-clamp-2 card-body break-words mb-2.5">
                            ${renderNoteText(m.text)}
                        </p>` : ''}

                        ${renderQuoteBlock(m, true)}

                        <div class="pt-2 border-t border-neutral-200/80 flex items-center justify-end text-[11px]" onclick="event.stopPropagation()">

                            <div class="flex items-center gap-1.5">
                                <button onclick="toggleHideNote('${m.id}')" class="btn-paper px-2 py-0.5 rounded transition text-neutral-600">
                                    <i data-lucide="${state.hiddenNoteIds.includes(m.id) ? 'eye' : 'eye-off'}" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function renderThreadVisualizer() {
            const container = document.getElementById('threadVisualizerContainer');
            if (!state.selectedNoteId) {
                container.innerHTML = `
                    <div class="w-full max-w-[700px] mx-auto h-40 flex flex-col items-center justify-center text-xs text-neutral-400 font-medium border border-dashed border-neutral-300 rounded-lg p-4 text-center bg-neutral-100/30">
                        <i data-lucide="book-open" class="w-6 h-6 mb-1.5 opacity-40"></i>
                        <span>좌측 알림 목록에서 멘션 노트를 선택해 주세요.</span>
                    </div>
                `;
                return;
            }

            if (state.threadData.loading) {
                container.innerHTML = `
                    <div class="w-full max-w-[700px] mx-auto h-40 flex flex-col items-center justify-center text-xs text-neutral-400 font-medium border border-dashed border-neutral-300 rounded-lg p-4 text-center bg-neutral-100/30">
                        <i data-lucide="loader" class="w-6 h-6 mb-1.5 opacity-40 animate-spin"></i>
                        <span>대화 타래를 불러오는 중입니다...</span>
                    </div>
                `;
                return;
            }

            const threadNotes = state.threadData.notes;
            if (!threadNotes || threadNotes.length === 0) {
                container.innerHTML = `
                    <div class="w-full max-w-[700px] mx-auto h-40 flex flex-col items-center justify-center text-xs text-neutral-400 font-medium border border-dashed border-neutral-300 rounded-lg p-4 text-center bg-neutral-100/30">
                        <span>타래 내용이 없습니다.</span>
                    </div>
                `;
                return;
            }

            let html = '<div class="space-y-1.5 pb-1 w-full max-w-[700px] mx-auto">';

            threadNotes.forEach((note) => {
                const isCurrentTarget = note.id === state.selectedNoteId;

                html += `
                    <div class="relative">
                        <div class="thread-note p-3 ${isCurrentTarget ? 'thread-note-current' : ''}">
                            <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-neutral-200">
                                <div class="flex items-center gap-2 min-w-0">
                                    <img src="${note.user?.avatarUrl || 'https://placehold.co/80x80/E6E8ED/22252E?text=U'}" class="w-5 h-5 rounded-full border border-neutral-300 object-cover shrink-0">
                                    <span class="font-bold text-neutral-900 truncate text-xs">${wrapEmoji(escapeHtml(cleanName(note.user?.name, note.user?.username)))}</span>
                                    <span class="card-handle truncate">@${escapeHtml(note.user?.username)}</span>
                                </div>
                                <span class="text-[11px] font-normal text-neutral-400 shrink-0">${formatRelativeTime(note.createdAt)}</span>
                            </div>

                            ${note.cw ? `<div class="p-2 mb-2 rounded bg-neutral-100 border border-neutral-400 text-neutral-800 font-medium text-[11px]">CW: ${escapeHtml(note.cw)}</div>` : ''}

                            ${note.text ? `<p class="card-body whitespace-pre-wrap">${renderNoteText(note.text)}</p>` : ''}

                            <div class="${note.text ? 'mt-2' : ''}">${renderQuoteBlock(note, false)}</div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;

            setTimeout(() => {
                const scroller = window.innerWidth >= 768 ? document.getElementById('threadScrollArea') : container;
                scroller.scrollTop = scroller.scrollHeight;
            }, 50);
        }

        function selectTargetNote(noteId) {
            if (state.selectedNoteId !== noteId) cancelChain();
            state.selectedNoteId = noteId;
            const found = noteCache.get(noteId) || state.mentions.find(m => m.id === noteId);

            if (found) {
                document.getElementById('replyTargetUserLabel').textContent = `@${found.user.username}@${found.user.host || ''}`;
                
                const visibilitySelect = document.getElementById('replyVisibilitySelect');
                if (visibilitySelect && found.visibility) {
                    visibilitySelect.value = found.visibility;
                    updateVisibilityBtn();
                }

                applyAutoMention(found);
                applyAutoCw(found);
            } else {
                document.getElementById('replyTargetUserLabel').textContent = `Note: ${noteId}`;
            }

            fetchThreadApi(noteId);
            renderFeed();

            // 모바일: 타래 화면으로 들어갈 때 기록을 하나 쌓아 두면 뒤로가기 키가 알림 목록으로 돌아감
            if (window.innerWidth < 768 && state.mobileView !== 'workspace') {
                try { history.pushState({ mw: 'thread' }, ''); } catch (e) {}
            }
            state.mobileView = 'workspace';
            updateResponsiveViews();
        }

        function deselectTargetNote() {
            cancelChain();
            const ta = document.getElementById('replyTextInput');
            if (lastAutoMention && ta.value === lastAutoMention) ta.value = '';
            lastAutoMention = '';
            updateReplyCharCounter();
            state.selectedNoteId = null;
            state.threadData = { notes: [], loading: false };
            document.getElementById('replyTargetUserLabel').textContent = '지정 없음';
            renderFeed();
            renderThreadVisualizer();
        }

        function switchToMobileList() {
            state.mobileView = 'list';
            updateResponsiveViews();
        }

        function updateResponsiveViews() {
            const sidePanel = document.getElementById('sideNotificationPanel');
            const mainPanel = document.getElementById('mainWorkspacePanel');

            if (window.innerWidth < 768) {
                if (state.mobileView === 'list') {
                    sidePanel.classList.remove('hidden');
                    sidePanel.classList.add('w-full');
                    mainPanel.classList.add('hidden');
                    mainPanel.classList.remove('flex');
                } else {
                    sidePanel.classList.add('hidden');
                    sidePanel.classList.remove('w-full');
                    mainPanel.classList.remove('hidden');
                    mainPanel.classList.add('flex', 'w-full');
                }
            } else {
                sidePanel.classList.remove('hidden', 'w-full');
                mainPanel.classList.remove('hidden');
                mainPanel.classList.add('flex');
            }
        }

        window.addEventListener('resize', updateResponsiveViews);

        // 뒤로가기 키: 타래 화면 → 알림 목록 (모바일)
        window.addEventListener('popstate', () => {
            if (window.innerWidth < 768 && state.mobileView === 'workspace') {
                state.mobileView = 'list';
                updateResponsiveViews();
            }
        });

        function isDesignatedUser(userObj) {
            if (!userObj) return false;
            const fullHandle = `${userObj.username}@${userObj.host || ''}`.toLowerCase();
            const usernameOnly = userObj.username.toLowerCase();

            return state.designatedUsers.some(u => {
                const clean = u.toLowerCase().replace(/^@/, '').replace(/\/+$/, '');
                return clean === fullHandle || clean === usernameOnly;
            });
        }

        function toggleDesignatedUser(handle) {
            const cleanHandle = handle.toLowerCase().replace(/^@/, '');
            const index = state.designatedUsers.findIndex(u => u.toLowerCase().replace(/^@/, '').replace(/\/+$/, '') === cleanHandle);

            if (index > -1) {
                state.designatedUsers.splice(index, 1);
                showToast("지정 사용자 해제되었습니다.", "info");
            } else {
                state.designatedUsers.push(cleanHandle);
                showToast("지정 사용자 추가되었습니다.", "success");
            }

            saveLocalState();
            renderFilters();
            renderFeed();
        }

        /* ================= 지정 인원 관리 ================= */
        function passesDesignatedOnly(m) {
            return true;   // 전체 탭은 지정 여부와 상관없이 모두 표시
        }

        function openDesignatedManager() {
            renderDesignatedModal();
            openModal('designatedModal');
        }

        function renderDesignatedModal() {
            const list = document.getElementById('designatedList');
            const tg = document.getElementById('threadGroupingCheck');
            if (tg) tg.checked = state.filters.threadGrouping;
            if (!list) return;
            if (state.designatedUsers.length === 0) {
                list.innerHTML = '<p class="text-xs text-neutral-400 font-medium py-1">지정된 인원이 없어요. (없으면 모든 멘션이 표시돼요)</p>';
                return;
            }
            list.innerHTML = state.designatedUsers.map((u, i) => `
                <div class="flex items-center justify-between p-2 rounded-lg border border-neutral-300 bg-neutral-50 shadow-sm">
                    <span class="text-xs font-medium text-neutral-900 truncate">@${escapeHtml(u)}</span>
                    <button onclick="removeDesignatedUser(${i})" class="btn-paper px-2.5 py-1 rounded text-xs font-medium text-neutral-600 shrink-0">삭제</button>
                </div>
            `).join('');
        }

        function addDesignatedFromInput() {
            const input = document.getElementById('designatedAddInput');
            const clean = input.value.trim().replace(/^@/, '').replace(/\/+$/, '').toLowerCase();
            if (!clean) { showToast("추가할 아이디를 입력하세요.", "warning"); return; }
            if (state.designatedUsers.some(u => u.toLowerCase() === clean)) {
                showToast("이미 지정된 인원입니다.", "info");
                return;
            }
            state.designatedUsers.push(clean);
            input.value = '';
            saveLocalState();
            renderDesignatedModal();
            renderFilters();
            renderFeed();
        }

        function removeDesignatedUser(index) {
            state.designatedUsers.splice(index, 1);
            saveLocalState();
            renderDesignatedModal();
            renderFilters();
            renderFeed();
        }


        function toggleHideNote(noteId) {
            if (state.hiddenNoteIds.includes(noteId)) {
                state.hiddenNoteIds = state.hiddenNoteIds.filter(id => id !== noteId);
            } else {
                state.hiddenNoteIds.push(noteId);
            }
            saveLocalState();
            renderFilters();
            renderFeed();
        }

        function isUnrepliedTarget(m) {
            if (state.hiddenNoteIds.includes(m.id)) return false;
            if (state.repliedNoteIds.includes(m.id)) return false;
            if (state.designatedUsers.length > 0 && !isDesignatedUser(m.user)) return false;
            return true;
        }

        function toggleRepliedNote(noteId) {
            if (state.repliedNoteIds.includes(noteId)) {
                state.repliedNoteIds = state.repliedNoteIds.filter(id => id !== noteId);
            } else {
                state.repliedNoteIds.push(noteId);
            }
            saveLocalState();
            renderFilters();
            renderFeed();
        }

        function handleFeedSearch() {
            state.filters.searchQuery = document.getElementById('feedSearchInput').value.trim();
            renderFeed();
        }

        function toggleCwInput() {
            state.replyForm.showCw = !state.replyForm.showCw;
            const container = document.getElementById('cwInputContainer');
            if (state.replyForm.showCw) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                document.getElementById('replyCwInput').value = '';
            }
        }

        function updateReplyCharCounter() {
            const el = document.getElementById('replyCharCounter');
            const texts = getReplyTexts();
            const total = texts.reduce((n, t) => n + t.length, 0);
            const noteCount = texts.reduce((n, t) => n + splitForLimit(t).length, 0);
            if (noteCount > 1) {
                el.textContent = `${total}자 · ${noteCount}개로 나눠 전송`;
            } else {
                el.textContent = `${document.getElementById('replyTextInput').value.length} / ${MAX_NOTE_LEN}`;
            }
        }

        function openAccountManager() {
            openModal('accountModal');
        }

        function renderModalAccountList() {
            const container = document.getElementById('modalAccountList');
            if (state.accounts.length === 0) {
                container.innerHTML = `<p class="text-xs text-neutral-400 font-medium py-1">등록된 계정이 없습니다.</p>`;
                return;
            }

            container.innerHTML = state.accounts.map(acc => `
                <div class="flex items-center justify-between p-2.5 rounded-lg border border-neutral-300 bg-neutral-50 shadow-sm">
                    <div class="min-w-0">
                        <p class="text-xs font-bold text-neutral-900 truncate">@${acc.user.username}</p>
                        <p class="text-[11px] text-neutral-500 truncate">${acc.instance}</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="selectActiveAccount('${acc.id}')" class="px-2.5 py-1 rounded text-xs font-medium transition ${acc.id === state.activeAccountId ? 'btn-paper-dark' : 'btn-paper'}">
                            ${acc.id === state.activeAccountId ? '선택됨' : '선택'}
                        </button>
                        <button onclick="removeAccount('${acc.id}')" class="btn-paper px-2.5 py-1 rounded text-xs font-medium transition text-neutral-600">
                            삭제
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function selectActiveAccount(accId) {
            state.activeAccountId = accId;
            saveLocalState();
            renderAll();
            manualFetchMentions();
            closeModal('accountModal');
        }

        function removeAccount(accId) {
            state.accounts = state.accounts.filter(a => a.id !== accId);
            if (state.activeAccountId === accId) {
                state.activeAccountId = state.accounts[0]?.id || null;
            }
            saveLocalState();
            renderAll();
        }

        function openMenuDrawer() {
            document.getElementById('menuDrawer').classList.add('open');
            document.getElementById('menuBackdrop').classList.add('open');
        }
        function closeMenuDrawer() {
            document.getElementById('menuDrawer').classList.remove('open');
            document.getElementById('menuBackdrop').classList.remove('open');
        }
        function menuGo(fn) { closeMenuDrawer(); fn(); }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            toast.className = 'px-3.5 py-2 rounded-lg border-2 border-neutral-300 bg-[#F0F2F5] text-neutral-900 text-xs font-medium shadow-xl pointer-events-auto transition transform translate-y-2 opacity-0 flex items-center gap-2';
            toast.textContent = message;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 200);
            }, 2500);
        }

        function renderQuoteBlock(note, clamp) {
            if (!note || (!note.renote && !note.renoteId)) return '';
            const rn = note.renote;
            if (!rn) {
                return `<div class="quote-block quote-missing">↻ 인용한 노트 (내용을 불러오지 못했어요)</div>`;
            }
            const handle = `${rn.user.username}@${rn.user.host || ''}`;
            return `
                <div class="quote-block">
                    <div class="flex items-center gap-1.5 mb-1 min-w-0">
                        <img src="${rn.user.avatarUrl}" class="w-4 h-4 rounded-full border border-neutral-300 object-cover shrink-0">
                        <span class="text-[11px] font-semibold text-neutral-800 truncate">${wrapEmoji(escapeHtml(cleanName(rn.user.name, rn.user.username)))}</span>
                        <span class="card-handle truncate">@${escapeHtml(handle)}</span>
                    </div>
                    ${rn.cw ? `<div class="mb-1 text-[11px] font-medium text-neutral-700">CW: ${escapeHtml(rn.cw)}</div>` : ''}
                    ${rn.text ? `<p class="quote-text break-words ${clamp ? 'preview-clamp-2' : 'whitespace-pre-wrap'}">${renderNoteText(rn.text)}</p>` : ''}
                    ${rn.fileCount ? `<span class="text-[10px] text-neutral-500">첨부 ${rn.fileCount}개</span>` : ''}
                </div>
            `;
        }

        /* ================= MFM 렌더링 (자주 쓰는 구문, 모든 글자는 이스케이프 후 출력) ================= */
        const MFM_MENTION_RE = /(^|[\s(（「])(@[A-Za-z0-9_]+(?:@[A-Za-z0-9._-]*[A-Za-z0-9])?)/g;
        function mfmText(t) {
            return escapeHtml(t).replace(MFM_MENTION_RE, '$1<span class="mention-tag">$2</span>');
        }
        function mfmColor(v) {
            return (typeof v === 'string' && /^[0-9a-fA-F]+$/.test(v) && [3, 4, 6, 8].includes(v.length)) ? '#' + v : null;
        }
        function mfmNum(v, min, max, def) {
            const n = parseFloat(v);
            return isNaN(n) ? def : Math.min(max, Math.max(min, n));
        }
        function mfmTime(v) {
            if (typeof v !== 'string' || !/^\d*\.?\d+s$/.test(v)) return null;
            return parseFloat(v) <= 60 ? v : null;
        }

        function mfmFn(name, argStr, content, depth) {
            const args = {};
            (argStr || '').split(',').forEach(a => {
                if (!a) return;
                const [k, ...v] = a.split('=');
                args[k] = v.length ? v.join('=') : true;
            });
            const inner = () => mfmInline(content, depth + 1);
            const anim = () => {
                let st = '';
                const sp = mfmTime(args.speed); if (sp) st += `animation-duration:${sp};`;
                const de = mfmTime(args.delay); if (de) st += `animation-delay:${de};`;
                return st;
            };
            const span = (cls, style, html) => `<span class="${cls}"${style ? ` style="${style}"` : ''}>${html}</span>`;

            switch (name) {
                case 'tada': case 'jelly': case 'twitch': case 'shake': case 'jump': case 'bounce': case 'rainbow': case 'fade':
                    return span(`mfm-fx mfm-${name}`, anim(), inner());
                case 'sparkle':
                    return span('mfm-sparkle', '', inner());
                case 'spin': {
                    const cls = 'mfm-fx mfm-spin' + (args.x ? ' mfm-spin-x' : args.y ? ' mfm-spin-y' : '');
                    let st = anim();
                    if (args.alternate) st += 'animation-direction:alternate;';
                    else if (args.left) st += 'animation-direction:reverse;';
                    return span(cls, st, inner());
                }
                case 'flip': {
                    const h = !!args.h || !args.v, v = !!args.v;
                    return span('mfm-inl', `transform:scale(${h ? -1 : 1},${v ? -1 : 1});`, inner());
                }
                case 'x2': case 'x3': case 'x4':
                    return span('mfm-inl mfm-size mfm-' + name, '', inner());
                case 'scale': {
                    const x = mfmNum(args.x, 0, 5, 1), y = mfmNum(args.y, 0, 5, 1);
                    return span('mfm-inl', `transform:scale(${x},${y});`, inner());
                }
                case 'position': {
                    const x = mfmNum(args.x, -100, 100, 0), y = mfmNum(args.y, -100, 100, 0);
                    return span('mfm-inl', `transform:translate(${x}em,${y}em);`, inner());
                }
                case 'fg': { const c = mfmColor(args.color); return span('', c ? `color:${c};` : '', inner()); }
                case 'bg': { const c = mfmColor(args.color); return span('', c ? `background-color:${c};` : '', inner()); }
                case 'border': {
                    const w = mfmNum(args.width, 0, 20, 1);
                    const st = ['solid', 'dotted', 'dashed', 'double', 'groove', 'ridge', 'inset', 'outset'].includes(args.style) ? args.style : 'solid';
                    const c = mfmColor(args.color) || 'var(--mac-ink)';
                    const r = mfmNum(args.radius, 0, 200, 0);
                    return span('mfm-inl', `border:${w}px ${st} ${c};border-radius:${r}px;`, inner());
                }
                case 'font': {
                    const f = ['serif', 'monospace', 'cursive', 'fantasy', 'emoji', 'math'].find(k => args[k]);
                    return span('', f ? `font-family:${f};` : '', inner());
                }
                case 'blur': return span('mfm-blur', '', inner());
                case 'rotate': {
                    const d = mfmNum(args.deg, -3600, 3600, 90);
                    return span('mfm-inl', `transform:rotate(${d}deg);`, inner());
                }
                case 'ruby': {
                    const m = /^(\S+)\s+([\s\S]+)$/.exec(content.trim());
                    return m ? `<ruby>${mfmText(m[1])}<rt>${mfmText(m[2])}</rt></ruby>` : inner();
                }
                default:
                    // 모르는 함수는 구문 그대로 보여줌
                    return mfmText('$[' + name + (argStr ? '.' + argStr : '') + ' ') + inner() + ']';
            }
        }

        function mfmInline(str, depth) {
            depth = depth || 0;
            if (!str) return '';
            if (depth > 6) return mfmText(str);
            let out = '', buf = '', i = 0;
            const push = () => { if (buf) { out += mfmText(buf); buf = ''; } };
            const FMT = [['**', '**', 'b'], ['~~', '~~', 's'], ['<b>', '</b>', 'b'], ['<i>', '</i>', 'i'], ['<s>', '</s>', 's'], ['<small>', '</small>', 'small']];

            while (i < str.length) {
                // $[함수 내용]
                if (str.startsWith('$[', i)) {
                    let d = 0, j = i;
                    for (; j < str.length; j++) {
                        if (str.startsWith('$[', j)) { d++; j++; }
                        else if (str[j] === ']') { d--; if (d === 0) break; }
                    }
                    if (d === 0 && j < str.length) {
                        const m = /^([A-Za-z0-9]+)(?:\.([^\s]*))?\s([\s\S]*)$/.exec(str.slice(i + 2, j));
                        if (m) { push(); out += mfmFn(m[1], m[2], m[3], depth); i = j + 1; continue; }
                    }
                }
                // **굵게** ~~취소선~~ <b> <i> <s> <small>
                let matched = false;
                for (const [o, c, tag] of FMT) {
                    if (str.startsWith(o, i)) {
                        const k = str.indexOf(c, i + o.length);
                        if (k > i + o.length) {
                            push();
                            out += `<${tag}>${mfmInline(str.slice(i + o.length, k), depth + 1)}</${tag}>`;
                            i = k + c.length;
                            matched = true;
                        }
                        break;
                    }
                }
                if (matched) continue;
                // <plain>
                if (str.startsWith('<plain>', i)) {
                    const k = str.indexOf('</plain>', i + 7);
                    if (k >= 0) { push(); out += mfmText(str.slice(i + 7, k)); i = k + 8; continue; }
                }
                // `인라인 코드`
                if (str[i] === '`') {
                    const k = str.indexOf('`', i + 1);
                    if (k > i + 1 && !str.slice(i + 1, k).includes('\n')) {
                        push(); out += `<code class="mfm-code">${escapeHtml(str.slice(i + 1, k))}</code>`; i = k + 1; continue;
                    }
                }
                // *기울임*
                if (str[i] === '*' && str[i + 1] && str[i + 1] !== '*' && str[i + 1] !== ' ' && str[i + 1] !== '\n') {
                    const k = str.indexOf('*', i + 1);
                    if (k > i + 1 && str[k - 1] !== ' ' && !str.slice(i + 1, k).includes('\n')) {
                        push(); out += `<i>${mfmInline(str.slice(i + 1, k), depth + 1)}</i>`; i = k + 1; continue;
                    }
                }
                // 링크
                if (str[i] === 'h' && /^https?:\/\//.test(str.slice(i, i + 8))) {
                    const m = /^https?:\/\/[^\s<>"'`]+/.exec(str.slice(i));
                    if (m) {
                        const url = m[0].replace(/[.,;:!?)\]」』】、。！？]+$/, '');
                        if (url.length > 8) {
                            push();
                            out += `<a class="mfm-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer nofollow" onclick="event.stopPropagation()">${escapeHtml(url)}</a>`;
                            i += url.length;
                            continue;
                        }
                    }
                }
                buf += str[i];
                i++;
            }
            push();
            return out;
        }

        // 줄 단위 블록(코드블록, 인용, 가운데 정렬) 처리 후 나머지는 인라인으로
        function mfmRender(text) {
            const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
            let out = '', buf = [];
            const flush = () => { if (buf.length) { out += mfmInline(buf.join('\n'), 0); buf = []; } };
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i], t = line.trim();
                if (t.startsWith('```')) {
                    let k = -1;
                    for (let j = i + 1; j < lines.length; j++) { if (lines[j].trim().startsWith('```')) { k = j; break; } }
                    if (k > i) {
                        flush();
                        out += `<pre class="mfm-codeblock"><code>${escapeHtml(lines.slice(i + 1, k).join('\n'))}</code></pre>`;
                        i = k;
                        continue;
                    }
                }
                if (line.startsWith('>')) {
                    const q = [];
                    let j = i;
                    while (j < lines.length && lines[j].startsWith('>')) { q.push(lines[j].replace(/^>\s?/, '')); j++; }
                    flush();
                    out += `<div class="mfm-quote">${mfmInline(q.join('\n'), 0)}</div>`;
                    i = j - 1;
                    continue;
                }
                if (t.startsWith('<center>')) {
                    let done = false;
                    for (let j = i; j < lines.length; j++) {
                        if (lines[j].trim().endsWith('</center>')) {
                            const block = lines.slice(i, j + 1).join('\n').trim();
                            flush();
                            out += `<div style="text-align:center">${mfmRender(block.slice(8, block.length - 9))}</div>`;
                            i = j; done = true;
                            break;
                        }
                    }
                    if (done) continue;
                }
                buf.push(line);
            }
            flush();
            return out;
        }

        function renderNoteText(text) { return wrapEmoji(mfmRender(text || '')); }
        function _renderNoteTextRaw(text) {
            return escapeHtml(text || '').replace(/(^|[\s(（「])(@[A-Za-z0-9_]+(?:@[A-Za-z0-9._-]*[A-Za-z0-9])?)/g, '$1<span class="mention-tag">$2</span>');
        }

        // 닉네임의 :커스텀이모지: 문자열 제거 (이모지 데이터가 없어 글자로 뜨는 것 방지)
        function cleanName(name, fallback) {
            const n = (name || '').replace(/:[A-Za-z_][A-Za-z0-9_]*(?:@[A-Za-z0-9.\-]+)?:/g, '').replace(/\s+/g, ' ').trim();
            return n || fallback || '';
        }
        function shortName(name, max = 7) {
            const arr = Array.from(name);
            return arr.length > max ? arr.slice(0, max).join('') + '...' : name;
        }

        // 유니코드 이모지를 감싸서 글자보다 낮게 보이는 문제 보정
        const EMOJI_RE = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator}{2})(?:\uFE0F|\u200D\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*/gu;
        function wrapEmoji(html) {
            return html.split(/(<[^>]*>)/).map(part => part.startsWith('<') ? part : part.replace(EMOJI_RE, '<span class="emo">$&</span>')).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatRelativeTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const now = new Date();
            const diffSec = Math.floor((now - date) / 1000);

            if (diffSec < 60) return '방금 전';
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)}분 전`;
            if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}시간 전`;
            return `${Math.floor(diffSec / 86400)}일 전`;
        }
    </script>
